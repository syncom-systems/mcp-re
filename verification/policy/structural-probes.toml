[[probe]]
id = "S07"
unit = "proxy.ed25519_public_key_sole_producer"
kind = "in-crate-source-injection"
crate = "//mcp-re-proxy:mcp_re_proxy"
invariant = "no code outside `communication_assurance::ed25519_public_key` can place bytes in an Ed25519PublicKeyValue's representation, so every inhabitant's thirty-two bytes were written by this owner under its own encoding rule"
insertion_parent = "mcp-re-proxy/src/communication_assurance/mod.rs"
marker = "STRUCTURAL-PROBE-SITE"
error_code = "E0451"
note = """
THE INTERESTING CASE, and the one that shows why the claim is worded to the BOUNDARY and
not to the constructor count. This owner has TWO public constructors and the second,
`for_point`, is TOTAL — it takes a raw thirty-two-byte point and cannot fail. That is not a
hole: the invariant is the canonical RFC 8410 encoding of an Ed25519 key, the length is the
parameter's type, and the algorithm and encoding are the owner's, so `for_point` admits no
inhabitant `interpret_rfc8410_spki` would reject. Its totality is the theorem
`the_two_directions_are_inverse` read as a constructor.

So a probe asserting "there is one way in" would state something false. What is true, and
what S07 attacks, is that both ways in are the OWNER's: a sibling module cannot write the
field itself and therefore cannot produce a value whose bytes did not pass the owner's rule.
"""
construction = "// ADR-MCPRE-068 structural probe S07. Injected into a scratch copy by verify-structural;\n// this file cannot exist in the working tree, because it would not build \u2014 which is the\n// proposition it witnesses.\n//\n// The hostile value is NOT an illegal key \u2014 there is no such thing for this invariant,\n// which is exactly why the probe attacks the FIELD rather than a rejected input. What it\n// witnesses is that the thirty-two bytes can only be placed in the representation by the\n// owner, so every inhabitant carries the owner's encoding rule rather than a caller's.\nuse crate::communication_assurance::Ed25519PublicKeyValue;\n\npub fn hostile() -> Ed25519PublicKeyValue {\n    Ed25519PublicKeyValue {\n        raw_point: [0u8; 32], // STRUCTURAL-PROBE-SITE\n    }\n}\n"

