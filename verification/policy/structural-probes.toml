# SPDX-License-Identifier: Apache-2.0
#
# The `structural://` probe registry — ADR-MCPRE-068 §4.1, §12.1, Phase 0B.
#
# A STRUCTURAL proposition says the representation admits no illegal inhabitant: possession
# of the value IS the proof. Its falsifier is a construction the compiler must REFUSE, so
# each record here is a hostile construction, where it has to live, and the exact rustc
# refusal that counts as evidence. `tools/verification/verify-structural` runs them inside a
# scratch copy of the tree; nothing here is ever written into the working tree.
#
# `producer_paths` answers for EVERY route in `_structural.PRODUCER_PATHS`, including the
# ones that do not apply. The ratification of ADR-MCPRE-068 is explicit that private fields
# alone are insufficient and that a witness must account for every producer path relevant to
# the claimed invariant — so an unanswered route is refused by the loader, because it is
# indistinguishable from an unconsidered one.
#
# NOTHING HERE DECLARES A UNIT'S CLASS. Phase 0B builds the lane; Phase 0D moves the units
# that these probes turn out to establish, through the class-transition ratchet. A unit may
# not declare `structural://` until this lane exists and fail-closes on zero execution,
# which is what `verify-structural` and `test_structural_lane.py` establish.

schema_version = 1

# --- http_profile.verifier_result_separation -------------------------------------------
#
# The unit's claim: "the verifier's assurance products are not substitutable: a weaker
# product cannot be passed where a stronger one is required". Its three declared controls
# are `doc#` items whose doctests are ```compile_fail bodies — a hostile construction the
# TYPE SYSTEM refuses, running on the merge path, recorded in the registry as `test://`.
# ADR-MCPRE-068 §12.1 calls it the best worked example of the defect in the repository.
#
# These probes compile the same constructions themselves rather than relying on rustdoc,
# because rustdoc's expected-error-code annotation is checked only on nightly: on the pinned
# stable toolchain `compile_fail,E0308` and bare `compile_fail` are the same declaration.

[[probe]]
id = "S01"
unit = "http_profile.verifier_result_separation"
kind = "crate-boundary-compile-fail"
crate = "//mcp-re-http-profile:mcp_re_http_profile"
invariant = "a cryptographic-floor bound response cannot be passed where a fully verified response is required"
doc_path = "mcp-re-http-profile/src/verified_response/bound.rs"
doc_item = "doc#verified_response::bound::VerifiedMcpResponse"
insertion_path = "mcp-re-http-profile/structural_probes/structural_probe_s01.rs"
marker = "STRUCTURAL-PROBE-SITE"
error_code = "E0308"
construction = """
// ADR-MCPRE-068 structural probe S01. Injected into a scratch copy by verify-structural;
// this file never exists in the working tree.
use mcp_re_http_profile::{CryptographicFloorVerifiedBoundResponse, VerifiedMcpResponse};

fn needs_full(_: &VerifiedMcpResponse) {}

pub fn hostile(floor: &CryptographicFloorVerifiedBoundResponse) {
    needs_full(floor); // STRUCTURAL-PROBE-SITE
}
"""
[probe.producer_paths]
module-tree-visibility = "the probe is its own test crate, compiled separately and linking the library, so it sees exactly the public surface a downstream consumer sees"
alternate-constructors = "the substitution attacked here is a coercion, not a construction: there is no `From<CryptographicFloorVerifiedBoundResponse> for VerifiedMcpResponse` and no `Deref`, which is what makes the two products non-substitutable rather than merely differently named"
generated-or-deserialization = "neither product derives Serialize/Deserialize; no decoder can mint one from bytes"
test-only-construction = "a downstream crate's test code sees the same public surface as its production code, so the probe's own placement in `tests/` is the test-only route, attacked rather than exempted"

