# SPDX-License-Identifier: Apache-2.0
#
# The gate registry: one row per script. It is where this repository says which scripts are
# gates, where each runs, and why one is not a control or not on the merge path.
#
# Population. Every `scripts/*.py` and `scripts/*.sh` has a row, and so does every path
# outside `scripts/` that carries `off_merge_path`. A script with no row, and a row naming
# no file, fail `scripts/merge_path_gate.py`.
#
# Fields:
#   path            repository-relative path of the script.
#   stages          the `scripts/local_gate.sh` stages that invoke it, by the order of the
#                   `run` lines (1 static, 2 suites, 3 BUILD drift, 4 SLO, 5 kind); [] when
#                   none does. Checked against local_gate.sh.
#   ci              every `<workflow file>:<job key>` under .github/workflows whose commands
#                   name it; [] when none does. Checked against the workflows.
#   selftest        whether the script handles a `--selftest` argument of its own. Checked
#                   against the script's text.
#   selftest_exempt present when a control has no `--selftest`, with the reason. A control
#                   with neither fails; so does an exemption on a row that has a selftest or
#                   is not a control.
#   not_a_control   present when the script is not a control at all — a driver, runner,
#                   report, demo or repository operation — with the reason. Such a script is
#                   outside the control census's gate population (tools/verification/_controls.py).
#   off_merge_path  present when the script is deliberately not required on the merge path,
#                   with the reason. For a script local_gate.sh invokes, the merge-path gate
#                   then accepts that no unconditional workflow names it; for an
#                   assurance-platform entry point under tools/verification/, that nothing
#                   reaches it. An `off_merge_path` naming nothing those checks would flag
#                   is a dead exemption and fails.
#
# The registry lists gates. It does not decide when or how they run: local_gate.sh and the
# workflows do, and this file is checked against them.

