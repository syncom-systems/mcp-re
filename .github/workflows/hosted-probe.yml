name: hosted-probe

# Measurement of the formal-verification toolchains on standard GitHub-hosted Linux.
# Read-only token, no secrets, no self-hosted runner. Reports runner shape, disk and memory
# high-water marks, and the Verus result, so the migration's lane designs rest on measured
# numbers. It writes no evidence record and is not a required check.

on:
  pull_request:
    paths:
      - ".github/workflows/hosted-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VERUS_RELEASE: "0.2026.08.09.92f466f"
  VERUS_ZIP_SHA256: "2f5a41c553f424aacdd732339e9d125563716a0b003c27730f75d6f81a282cef"

jobs:
  verus-x86-linux:
    name: probe verus (ubuntu-24.04 x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Runner shape
        run: |
          uname -a; nproc; free -m; df -h / /mnt 2>/dev/null
          echo "image: ${ImageOS:-?} ${ImageVersion:-?}"

      - name: Install the pinned Verus release, digest-checked
        run: |
          set -euo pipefail
          dest="/opt/verification/verus/${VERUS_RELEASE}"
          zip="$RUNNER_TEMP/verus.zip"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$zip" \
            "https://github.com/verus-lang/verus/releases/download/release/${VERUS_RELEASE}/verus-${VERUS_RELEASE}-x86-linux.zip"
          echo "${VERUS_ZIP_SHA256}  $zip" | sha256sum -c -
          sudo mkdir -p "$dest.tmp"
          sudo unzip -q "$zip" -d "$dest.tmp"
          sudo sh -c "mv '$dest.tmp'/*/ '$dest' 2>/dev/null || mv '$dest.tmp' '$dest'"
          sudo chmod -R a+rX "$dest"
          ls "$dest"
          cat "$dest/version.json"
          for f in verus rust_verify z3 vstd.vir libvstd.rlib; do
            printf '%s sha256:%s\n' "$f" "$(sha256sum "$dest/$f" | cut -d' ' -f1)"
          done

      - name: Prove every Verus unit (bazel, measured)
        run: |
          set -uo pipefail
          ( while sleep 15; do df -m / | awk 'NR==2{print "disk_used_mb=" $3}'; free -m | awk 'NR==2{print "mem_used_mb=" $3}'; done ) > "$RUNNER_TEMP/samples.log" &
          start=$(date +%s)
          /usr/bin/time -v bazel build \
            //mcp-re-core:mcp_re_core_verus //mcp-re-http-profile:mcp_re_http_profile_verus \
            2> "$RUNNER_TEMP/time.log"
          status=$?
          echo "bazel exit $status after $(( $(date +%s) - start )) s"
          grep -E "Maximum resident|Elapsed" "$RUNNER_TEMP/time.log" || true
          sort -t= -k2 -n "$RUNNER_TEMP/samples.log" | awk -F= '/disk/{d=$2} /mem/{m=($2>m)?$2:m} END{print "peak mem_used_mb=" m}'
          grep disk_used "$RUNNER_TEMP/samples.log" | sort -t= -k2 -n | tail -1
          for t in mcp-re-core/mcp_re_core_verus mcp-re-http-profile/mcp_re_http_profile_verus; do
            echo "== $t"; cat "bazel-bin/$t.status" 2>/dev/null || echo "no status"
            head -c 1500 "bazel-bin/$t.json" 2>/dev/null || true; echo
          done
          exit $status

  extraction-arm64:
    name: probe extraction image (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Runner shape
        run: |
          uname -a; nproc; free -m; df -h
          docker version --format '{{.Server.Version}} {{.Server.Os}}/{{.Server.Arch}}'

      - name: Build the pinned definition, sampling disk
        run: |
          set -uo pipefail
          df -m / | awk 'NR==2{print "disk_used_before_mb=" $3}'
          ( while sleep 20; do df -m / | awk 'NR==2{print $3}'; done ) > "$RUNNER_TEMP/disk.log" &
          start=$(date +%s)
          docker build --platform linux/arm64 -t extraction-probe -f verification/extraction/Dockerfile verification/extraction
          status=$?
          echo "docker build exit $status after $(( $(date +%s) - start )) s"
          echo "peak disk_used_mb=$(sort -n "$RUNNER_TEMP/disk.log" | tail -1)"
          df -m / | awk 'NR==2{print "disk_used_after_mb=" $3}'
          docker system df
          docker image inspect extraction-probe --format 'image size bytes={{.Size}} id={{.Id}}'
          exit $status
