name: verification-hosted

# The complete verification platform on standard GitHub-hosted Linux. Read-only token, no
# secrets, no self-hosted runner. Two execution jobs hand their evidence to one aggregate job
# as immutable artifacts:
#
#   host        ubuntu-24.04      `verify --phase host`: the Verus lane against the pinned
#                                  Linux x86-64 prover, and every other host lane
#   extraction  ubuntu-24.04-arm  `verify --phase extraction`: Charon, Aeneas and Lean inside
#                                  the pinned linux/arm64 extraction image
#   aggregate   ubuntu-24.04      `verify --aggregate --gate` over both evidence sets
#
# A lane that could not run leaves a missing record, and the aggregate reports it as
# INCOMPLETE; nothing here converts an absent measurement into success.

on:
  pull_request:
    paths:
      - ".github/workflows/verification-hosted.yml"
      - "scripts/install_pinned_verus.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: host lanes (ubuntu-24.04 x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Runner shape
        run: |
          uname -a; nproc; free -m; df -h /
          echo "image: ${ImageOS:-?} ${ImageVersion:-?}"

      - name: A fresh evidence directory for this run
        id: evidence
        run: |
          set -euo pipefail
          rel=".verification/run-${{ github.run_id }}-${{ github.run_attempt }}-host"
          mkdir -p "$PWD/$rel"
          echo "dir=$PWD/$rel" >> "$GITHUB_OUTPUT"
          echo "MCP_RE_EVIDENCE_DIR=$PWD/$rel" >> "$GITHUB_ENV"

      - name: Install the pinned Verus release, digest-checked
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/verification && sudo chown "$USER" /opt/verification
          python3 scripts/install_pinned_verus.py
          cat /opt/verification/verus/*/version.json

      - name: Install uv at a pinned version
        run: pipx install uv==0.12.3 && uv --version

      - name: Runner environment preflight
        run: ./scripts/verification_runner_preflight.sh

      - name: Prepare the non-Rust SDK batteries
        run: |
          set -euo pipefail
          ./scripts/prepare_python_matrix.sh
          ./scripts/prepare_node_matrix.sh

      - name: Structural and measured lane self-tests
        run: |
          python3 tools/verification/test_structural_lane.py
          python3 tools/verification/test_measured_lane.py

      - name: Execute the host lanes (measured)
        run: |
          set -uo pipefail
          ( while sleep 30; do
              printf 'disk_used_mb=%s mem_used_mb=%s\n' \
                "$(df -m / | awk 'NR==2{print $3}')" "$(free -m | awk 'NR==2{print $3}')"
            done ) > "$RUNNER_TEMP/samples.log" &
          start=$(date +%s)
          ./tools/verification/verify --phase host
          status=$?
          echo "host phase exit $status after $(( $(date +%s) - start )) s"
          sed -E 's/.*disk_used_mb=([0-9]+).*/\1/' "$RUNNER_TEMP/samples.log" | sort -n | tail -1 | sed 's/^/peak disk_used_mb=/'
          sed -E 's/.*mem_used_mb=([0-9]+)/\1/' "$RUNNER_TEMP/samples.log" | sort -n | tail -1 | sed 's/^/peak mem_used_mb=/'
          exit $status

      - name: The records this job produced
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.dir }}
          if-no-files-found: warn
          retention-days: 14

  extraction:
    name: extraction lanes (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Runner shape
        run: |
          uname -a; nproc; free -m; df -h /

      - name: A fresh evidence directory for this run
        id: evidence
        run: |
          set -euo pipefail
          rel=".verification/run-${{ github.run_id }}-${{ github.run_attempt }}-extraction"
          mkdir -p "$PWD/$rel"
          echo "dir=$PWD/$rel" >> "$GITHUB_OUTPUT"
          echo "rel=$rel" >> "$GITHUB_OUTPUT"

      - name: Containerd image store, so an image id is the manifest digest the lock records
        run: |
          set -euo pipefail
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Fetch the preserved extraction archive and load it
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r digest archive tag < <(python3 -c "
          import tomllib
          d = tomllib.load(open('verification/policy/toolchains.lock.toml','rb'))['extraction_container']
          assert d['state'] == 'resolved' and d['platform'] == 'linux/arm64'
          print(d['artifact_digest'], d['archive_digest'].split(':')[1], 'extraction-archive-' + d['artifact_digest'].split(':')[1][:8])")
          start=$(date +%s)
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/arch" -p 'archive.part-*'
          cat "$RUNNER_TEMP"/arch/archive.part-* > "$RUNNER_TEMP/archive.tar"
          rm -rf "$RUNNER_TEMP/arch"
          echo "${archive}  $RUNNER_TEMP/archive.tar" | sha256sum -c -
          echo "fetch_seconds=$(( $(date +%s) - start ))"
          docker load -i "$RUNNER_TEMP/archive.tar"
          rm -f "$RUNNER_TEMP/archive.tar"
          echo "fetch_and_load_seconds=$(( $(date +%s) - start ))"
          id=$(docker image inspect "$digest" --format '{{.Id}}')
          test "$id" = "$digest"
          echo "image=$id" >> "$GITHUB_OUTPUT"
          df -m / | awk 'NR==2{print "disk_used_after_load_mb=" $3}'

      - name: Regenerate the extracted model
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 -m 12g --memory-swap 14g \
            -v "$PWD:/workspace" -w /workspace \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/workspace \
            -e MCP_RE_EVIDENCE_DIR='/workspace/${{ steps.evidence.outputs.rel }}' \
            '${{ steps.image.outputs.image }}' ./tools/verification/regenerate-lean

      - name: Lean lane activation probe
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 -m 12g --memory-swap 14g \
            -v "$PWD:/workspace" -w /workspace \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/workspace \
            '${{ steps.image.outputs.image }}' ./tools/verification/verify-lean --activation-probe

      - name: Execute the extraction lanes (measured)
        run: |
          set -uo pipefail
          ( while sleep 30; do
              printf 'disk_used_mb=%s mem_used_mb=%s\n' \
                "$(df -m / | awk 'NR==2{print $3}')" "$(free -m | awk 'NR==2{print $3}')"
            done ) > "$RUNNER_TEMP/samples.log" &
          start=$(date +%s)
          docker run --rm --platform linux/arm64 -m 12g --memory-swap 14g \
            -v "$PWD:/workspace" -w /workspace \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/workspace \
            -e MCP_RE_EVIDENCE_DIR='/workspace/${{ steps.evidence.outputs.rel }}' \
            '${{ steps.image.outputs.image }}' ./tools/verification/verify --phase extraction
          status=$?
          echo "extraction phase exit $status after $(( $(date +%s) - start )) s"
          sed -E 's/.*disk_used_mb=([0-9]+).*/\1/' "$RUNNER_TEMP/samples.log" | sort -n | tail -1 | sed 's/^/peak disk_used_mb=/'
          sed -E 's/.*mem_used_mb=([0-9]+)/\1/' "$RUNNER_TEMP/samples.log" | sort -n | tail -1 | sed 's/^/peak mem_used_mb=/'
          exit $status

      - name: The records this job produced
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-extraction-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.dir }}
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: compose the repository verdict
    needs: [host, extraction]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@v8
        with:
          pattern: evidence-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/records
          merge-multiple: true
      - name: Compose the verdict from both records sets
        run: |
          set -euo pipefail
          mkdir -p .verification/composed
          cp -R "$RUNNER_TEMP"/records/. .verification/composed/
          export MCP_RE_EVIDENCE_DIR="$PWD/.verification/composed"
          ls "$MCP_RE_EVIDENCE_DIR" | head -50
          ./tools/verification/verify --aggregate --gate
