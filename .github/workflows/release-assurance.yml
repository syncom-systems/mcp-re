# SPDX-License-Identifier: Apache-2.0
#
# Release assurance — the BINDING closure lane, deliberately off the merge path.
#
# ADR-MCPRE-059 §28.8 keeps two modes apart on purpose. Ordinary development CI runs
# `review --root-completeness`, which is report-only: an honest unresolved GAP under a
# declared root must not fail everyday work, or the incentive becomes to leave the
# obligation unrecorded. THIS lane runs the binding mode, where a declared root that is not
# established fails.
#
# It exists because the binding mode had ZERO invokers, measured 2026-09-14. It had been run
# by hand for v0.16 and v0.17 and its verdict typed into a provenance document — the
# "prose and status are claims, not evidence" failure applied to a closure criterion.
#
# ALL SEMANTICS LIVE IN `tools/verification/release-assurance`. This file checks out a
# target, gives the command the evidence to compose, runs it, and keeps what it produced.
# It decides nothing: a verdict computed in YAML is a verdict with no owner and no tests.
#
# `workflow_dispatch` only, on an ephemeral GitHub-hosted runner with a read-only token and
# no secrets. The target must be REACHABLE FROM `main` -- a step below refuses anything else
# -- because a release candidate is a commit of `main`: release assurance qualifies the tree
# that was merged, never a branch or a tag that merely names a commit.
#
# Release qualification does not ask a performance question. An SLO result is observational
# performance evidence bound to a software subject and a measurement context, produced by
# `.github/workflows/slo.yml` when an owner wants one; its absence or staleness is never a
# release-assurance failure.

name: release assurance

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The commit, tag or branch to qualify. Checked out exactly.
        required: true
        type: string
      verification_run_id:
        description: >-
          A `verification` workflow run ON THIS SAME COMMIT whose evidence records this
          run composes. Evidence from another tree does not silently pass: the aggregate
          validates every record against the current fingerprints and reports INCOMPLETE.
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  release-assurance:
    name: release assurance (binding closure)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # A dispatch runs the workflow file of the branch it names, so a copy on another branch
      # could drop every guard below. This refusal states the rule; what ENFORCES it is
      # outside any branch's reach: the record names this run, and
      # `scripts/release_assurance_gate.py --verify-run` refuses to let a record be
      # committed unless GitHub reports the run as this workflow, on `main`, a successful
      # dispatch, whose uploaded record is byte-identical to the file.
      - name: Dispatched from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "release assurance runs only from main's copy of this workflow, not ${GITHUB_REF}" >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # The reachability guard below needs main and the target in one history, and a
          # depth-1 checkout has neither. A full fetch also brings `origin/main`, so no later
          # step needs the token, and it is not left in the git config.
          fetch-depth: 0
          persist-credentials: false

      # The release candidate is a commit of `main`. The steps below run the target's own
      # `tools/verification/release-assurance`, so this guard is what makes "the target's
      # authority" mean the authority that was merged.
      #
      # Do not relax this to `origin/*` or to tags, both of which can name an unmerged
      # commit; merge first, or change this guard in a commit that says why.
      - name: The target must be reachable from main
        run: |
          set -euo pipefail
          main="$(git rev-parse refs/remotes/origin/main)"
          sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$sha" "$main" || {
            echo "release assurance refuses $sha: it is not reachable from origin/main." >&2
            echo "A release candidate is a commit of main. Merge the commit first." >&2
            exit 1
          }
          echo "target $sha is reachable from origin/main ($main)"

      # The command refuses a dirty tree and refuses a `--target` that is not the checked-out
      # commit, so this resolves the input to the immutable thing the record will name.
      - name: Resolve the target
        id: target
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "target commit $sha"
          echo "target tree   $(git rev-parse 'HEAD^{tree}')"

      - name: The evidence this verdict is composed from
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The artifact IS an evidence store: a `bundle.json` beside one directory per
          # lane. It is restored whole, never flattened -- `evidence_store()` reads the
          # lane directories, and an earlier form of this step moved `*.json` up one level
          # and deleted the directories, which would have destroyed every record while
          # leaving a plausible-looking empty store behind.
          rm -rf .verification/evidence .verification/_artifact
          mkdir -p .verification/_artifact
          gh run download "${{ inputs.verification_run_id }}" \
            --repo "${{ github.repository }}" \
            --pattern 'verification-evidence-*' \
            --dir .verification/_artifact
          # One artifact, or refuse. Two would mean two runs' records composed together,
          # which is a verdict about no single tree.
          count="$(find .verification/_artifact -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          [ "$count" = "1" ] || {
            echo "expected exactly one verification-evidence artifact, found $count" >&2
            exit 1
          }
          inner="$(find .verification/_artifact -mindepth 1 -maxdepth 1 -type d)"
          mv "$inner" .verification/evidence
          rmdir .verification/_artifact
          test -f .verification/evidence/bundle.json || {
            echo "the restored store has no bundle.json: it is not an evidence store" >&2
            exit 1
          }
          echo "lanes restored: $(find .verification/evidence -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | tr '\n' ' ')"
          echo "records:        $(find .verification/evidence -type f -name '*.json' | wc -l | tr -d ' ')"
          echo "evidence_commit=$(gh run view "${{ inputs.verification_run_id }}" \
            --repo "${{ github.repository }}" --json headSha --jq .headSha)" >> "$GITHUB_OUTPUT"

      # The one authority. Everything above prepared its inputs; nothing above decided.
      #
      # The evidence run's own commit is passed in rather than assumed equal to the target.
      # Records are content-addressed — valid at a unit's fingerprint, not at a commit — so
      # evidence produced at one commit legitimately composes at another when nothing a unit
      # depends on moved. Measured 2026-09-14: records from `782b11e2` composed to PASS at
      # `e607a667`, correctly. What must not happen is a record that names one commit and
      # lets a reader assume the lanes executed there.
      - name: Release assurance
        run: |
          python3 tools/verification/release-assurance \
            --target "${{ steps.target.outputs.sha }}" \
            --evidence-run "${{ inputs.verification_run_id }}" \
            --evidence-commit "${{ steps.evidence.outputs.evidence_commit }}"

      # Kept on failure too. A failing run's record is the thing a reader needs most.
      #
      # This artifact is the RUN's copy and it expires. When a release is cut, the same
      # bytes are committed as `docs/releases/<version>-release-assurance.json` beside the
      # provenance document, and `scripts/release_assurance_gate.py` checks the document's
      # assurance block against that tracked record. A document checked against a file that
      # expires in 90 days is a document that stops being checked.
      - name: The record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-assurance-${{ steps.target.outputs.sha }}-${{ github.run_id }}
          path: .verification/release-assurance.json
          if-no-files-found: error
          retention-days: 90
