          # letting a cycle make the answer depend on iteration order. The last control runs
          # on the live registries and asserts the result is NON-EMPTY — an empty derivation
          # would leave every fixture control above true and meaningless.
          python3 tools/verification/test_assurance_graph.py



  # The structural lane's self-test builds hostile constructions with Bazel in a scratch copy
  # of the tree. On a runner without a Bazel cache it starts cold, so it runs here, behind the
  # main cache and a cache of the scratch copy's own output base. The measured lane's
  # self-test, the other half of ADR-MCPRE-068 Phase 0B, runs in `bazel-test-proxy`.
  selftests-bazel:
    name: assurance platform self-tests (structural lane)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - name: Set up the pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # The FFI closure (cryptoki-sys) builds bindings with libclang, same as the
      # cargo jobs; install it so the Bazel build links on a clean runner.
      - name: System build dependencies
        # The bounds on the fallback are not decoration; they are what the two earlier
        # attempts at this step were. With no bound at all, six jobs across four branches
        # sat in `apt-get update` for 28-58 minutes each reporting `pending` — which says
        # strictly less than a red would. With only `update` bounded, the `install` hung
        # instead. `Acquire::http::Timeout` does not help either: it bounds INACTIVITY,
        # and a transfer dribbling at 32 kB/s is never inactive.
        #
        # Nothing here is weakened. If the image ever stops shipping Clang the fallback
        # installs it exactly as before; a package that genuinely cannot be installed
        # still fails the step, and every gate below is untouched.
        run: |
          set -euo pipefail
          # cryptoki-sys builds its FFI bindings with bindgen, which needs libclang at
          # RUNTIME — the shared object, not the headers. The ubuntu-24.04 runner image
          # already ships Clang 18.1.3, so `libclang-dev` was re-downloading a library
          # the box already had: 28.8 MB fetched and ~292 MB unpacked, on every one of
          # three jobs, every run.
          #
          # That download is also the single least reliable thing in this workflow.
          # Measured on 2026-08-19 against the same Azure mirror, same file: 64.0 kB/s,
          # then 43.1 kB/s, then 32.1 kB/s — 14min 57s for the fetch alone, with the
          # unpack pushing past a 20-minute cap. Raising the cap is a race against a
          # mirror that keeps getting slower; not needing the file wins it outright.
          #
          # So: find what is already installed and point bindgen at it. apt is the
          # FALLBACK, not the default, and it keeps its bounds for the case where the
          # image stops shipping Clang.
          found=""
          for dir in /usr/lib/llvm-*/lib /usr/lib/x86_64-linux-gnu; do
            if compgen -G "$dir/libclang*.so*" > /dev/null 2>&1; then
              found="$dir"
              break
            fi
          done

          if [ -n "$found" ]; then
            echo "LIBCLANG_PATH=$found" >> "$GITHUB_ENV"
            echo "using the runner image's libclang in $found:"
            ls -1 "$found"/libclang*.so* | sed 's/^/  /'
          else
            echo "no libclang on the image — falling back to apt (bounded)"
            timeout 300 sudo apt-get update \
              || echo "apt-get update did not finish in 300s; using the runner image's package index"
            sudo apt-get install -y --no-install-recommends \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              libclang-dev
          fi

      # The Bazel output base and bazelisk download, restored from the newest cache main
      # saved (same locks first, then any). Only a push to main saves one — the
      # `bazel-cache` job — so the cache follows main instead of freezing at the first build under a
      # lock hash, and a PR never uploads its own ~2.4 GB copy. The key names the locks
      # the external repositories come from, and Cargo.lock, which gazelle_rust reads.
      - name: Restore Bazel cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'bazel/crates.lock') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'bazel/crates.lock') }}-
            bazel-${{ runner.os }}-
      # The structural lane builds in a scratch copy of the tree, which Bazel gives an
      # output base of its own, named by the MD5 of the copy's path. It is cached apart
      # from the main one, so restoring it costs this job alone.
      - name: The structural lane's output base
        id: lane
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import hashlib, os, sys
          sys.path.insert(0, "tools/verification")
          import _scratch
          tree = os.path.realpath(_scratch.lane_scratch("structural") / "tree")
          base = os.path.expanduser("~/.cache/bazel/_bazel_runner/") + hashlib.md5(tree.encode()).hexdigest()
          print(f"output_base={base}")
          EOF
      - name: Restore the structural lane's output base
        id: lanecache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.lane.outputs.output_base }}
          key: bazel-structural-lane-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'bazel/crates.lock') }}


      - name: Bazel version
        run: bazel version
      - name: Assurance platform self-tests (ADR-MCPRE-059) — the structural lane
        run: |
          # ADR-MCPRE-068 Phase 0B. This suite and the measured lane's (in
          # `bazel-test-proxy`) are not only self-tests of a lane's edges — they ARE the two
          # lanes' liveness, because the ratification requires each to fail-close on zero
          # execution and neither registry is yet large enough for a lane run to demonstrate
          # that it can go red. The structural suite compiles a hostile construction that
          # BUILDS and requires the runner to report FAIL; the measured suite runs a dead
          # apparatus, a silent one and an irreproducible one.
          python3 tools/verification/test_structural_lane.py

      # Keyed by the locks alone, so the first run under new locks — on main or on a pull
      # request — saves it and every later one restores it.
      - name: Save the structural lane's output base (first run under these locks)
        if: steps.lanecache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.lane.outputs.output_base }}
          key: bazel-structural-lane-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'bazel/crates.lock') }}


  # The branch ruleset requires a check named "Bazel build + test". The work it stands for
  # is the seven shards above; this job is the check. It runs `if: always()` because a job
  # whose `needs:` failed is SKIPPED, and a skipped required check reads as passing: the
  # script fails on anything but `success` from any shard, and on a run that reached it
  # after the pre-merge budget.
  required:
    name: Bazel build + test
    if: always()
