          # RUNTIME — the shared object, not the headers. The ubuntu-24.04 runner image
          # already ships Clang 18.1.3, so `libclang-dev` was re-downloading a library
          # the box already had: 28.8 MB fetched and ~292 MB unpacked, on every one of
          # three jobs, every run.
          #
          # That download is also the single least reliable thing in this workflow.
          # Measured on 2026-08-19 against the same Azure mirror, same file: 64.0 kB/s,
          # then 43.1 kB/s, then 32.1 kB/s — 14min 57s for the fetch alone, with the
          # unpack pushing past a 20-minute cap. Raising the cap is a race against a
          # mirror that keeps getting slower; not needing the file wins it outright.
          #
          # So: find what is already installed and point bindgen at it. apt is the
          # FALLBACK, not the default, and it keeps its bounds for the case where the
          # image stops shipping Clang.
          found=""
          for dir in /usr/lib/llvm-*/lib /usr/lib/x86_64-linux-gnu; do
            if compgen -G "$dir/libclang*.so*" > /dev/null 2>&1; then
              found="$dir"
              break
            fi
          done

          if [ -n "$found" ]; then
            echo "LIBCLANG_PATH=$found" >> "$GITHUB_ENV"
            echo "using the runner image's libclang in $found:"
            ls -1 "$found"/libclang*.so* | sed 's/^/  /'
          else
            echo "no libclang on the image — falling back to apt (bounded)"
            timeout 300 sudo apt-get update \
              || echo "apt-get update did not finish in 300s; using the runner image's package index"
            sudo apt-get install -y --no-install-recommends \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              libclang-dev
          fi

      # The Bazel output base and bazelisk download, restored from the newest cache main
      # saved (same locks first, then any). Only a push to main saves one — the
      # `bazel-cache` job — so the cache follows main instead of freezing at the first build under a
      # lock hash, and a PR never uploads its own ~2.4 GB copy. The key names the locks
      # the external repositories come from, and Cargo.lock, which gazelle_rust reads.
      - name: Restore Bazel cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'bazel/crates.lock') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'bazel/crates.lock') }}-
            bazel-${{ runner.os }}-

      - name: Bazel version
        run: bazel version
      - name: Build what the pre-merge jobs build
        run: |
          bazel test //... --test_output=errors
          bazel build --config=lint //...
          bazel build --config=rustfmt //...
          bazel build //sdk/python:wheel //mcp-re-proxy:http_profile_proxy
          bazel build -c opt //sdk/typescript:native //sdk/typescript:native_type_defs
          bazel build //mcp-re-proxy:tls_load_harness_bench //mcp-re-proxy:async_drain_test
          bazel build -c dbg //mcp-re-proxy:saturation_rig

      # After a green run on main only: what the next PR restores. Saving on success
      # alone keeps a cache from a run that failed halfway out of the chain.
      - name: Save Bazel cache (main)
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'bazel/crates.lock') }}-${{ github.sha }}

      # The structural lane builds in a scratch copy of the tree, which Bazel gives an
      # output base of its own, named by the MD5 of the copy's path. It is cached apart
      # from the main one, so restoring it costs this job alone.
      - name: The structural lane's output base
        id: lane
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import hashlib, os, sys
          sys.path.insert(0, "tools/verification")
          import _scratch
          tree = os.path.realpath(_scratch.lane_scratch("structural") / "tree")
          base = os.path.expanduser("~/.cache/bazel/_bazel_runner/") + hashlib.md5(tree.encode()).hexdigest()
          print(f"output_base={base}")
          EOF
      - name: Build the structural lane's output base
        run: python3 tools/verification/test_structural_lane.py
      - name: Save the structural lane's output base
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.lane.outputs.output_base }}
          key: bazel-structural-lane-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'bazel/crates.lock') }}



  sdk-python:
    name: downloader — Python SDK wheel (Bazel)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7

      - name: Set up the pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      # The cache `bazel-cache` saves on main, so the build below starts warm.
      - name: Restore Bazel cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'bazel/crates.lock') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'bazel/crates.lock') }}-
            bazel-${{ runner.os }}-

      # The wheel is Bazel's: the PyO3 binding is built by the same Rust toolchain and crate
      # universe as every other target, and packaged by rules_python's py_wheel.
      - name: Build the SDK wheel (bazel build //sdk/python:wheel)
        run: |
          # The transport e2e (tests/test_transport_e2e.py) stands up the project's own proof
          # proxy and skips when it is absent, so it is built here to be measured.
          bazel build //sdk/python:wheel //mcp-re-proxy:http_profile_proxy
          echo "WHEEL=$PWD/$(bazel cquery --output=files //sdk/python:wheel 2>/dev/null | head -1)" >> "$GITHUB_ENV"

      - name: Regenerated parity oracle must match the committed one
        run: |
          python -m venv /tmp/oracle
          /tmp/oracle/bin/pip install --quiet "$WHEEL"
          /tmp/oracle/bin/python tools/gen_sdk_parity_fixture.py
          git diff --exit-code -- sdk/fixtures/parity_vectors.json

      - name: Clean-env install (wheel only) + smoke import
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install "${WHEEL}[mcp]" "pytest>=8" "pytest-cov>=5"
          /tmp/venv/bin/python -c "import mcp_re_sdk, mcp_re_sdk._core; print('wheel import OK')"

      - name: pytest + coverage gate (installed wheel)
        run: |
          /tmp/venv/bin/python -m pytest sdk/python/tests -q \
            --cov --cov-config=sdk/python/pyproject.toml --cov-report=term-missing



  sdk-typescript:
    name: downloader — TypeScript napi package (Bazel)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    # ADR-MCPS-048 / MCPS-71 — the npm downloader path. The native addon is Bazel's
    # (//sdk/typescript:native), built by the same Rust toolchain and crate universe as
    # every other target; the pinned @napi-rs/cli renders its loader from the type
    # definitions napi-derive stated (//sdk/typescript:native_type_defs).
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      # The cache `bazel-cache` saves on main, so the build below starts warm.
      - name: Restore Bazel cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'bazel/crates.lock') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'bazel/crates.lock') }}-
            bazel-${{ runner.os }}-

      - name: Install JS dependencies
        run: npm ci

      # Bazel builds the native .node (-c opt) and renders native/binding.{js,d.ts};
      # tsc builds dist/. This is the published artifact's exact build.
      - name: Build native addon + TypeScript
        run: npm run build

      # The build REGENERATES the committed native/binding.js loader and binding.d.ts.
      # Generation is deterministic, so any diff here is real drift — a Rust export
      # changed, or the CLI pin moved: run `npm run build:native` and commit the result.
      - name: Generated napi loader is in sync with the exports and the pinned CLI
        run: git diff --exit-code -- native/binding.js native/binding.d.ts

      - name: Test + coverage gate (vitest)
        run: npx vitest run --coverage

      # Clean-env smoke install: pack the tarball exactly as published, install it
      # into an EMPTY project (no dev deps, no workspace), and require it — the
      # bundled native/*.node must load on its own.
      - name: Pack + clean-dir install smoke
        run: |
          npm pack --pack-destination /tmp
          TGZ=$(ls -t /tmp/mcp-re-sdk-*.tgz | head -1)
          mkdir -p /tmp/npm-smoke && cd /tmp/npm-smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$TGZ"
          node -e "const m=require('@mcp-re/sdk'); if(typeof m.signRequest!=='function'){throw new Error('napi package export missing');} console.log('npm package require OK')"
