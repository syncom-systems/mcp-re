# SPDX-License-Identifier: Apache-2.0
#
# MCP-RE continuous integration. Bazel is the Rust build and test authority: every
# Rust compile, lint and test below is a Bazel action, under the toolchain MODULE.bazel
# pins. Nothing here invokes Cargo.
#
# Gating policy. The branch ruleset requires three checks by name. Each is a job that
# `needs:` the shards doing its work, runs `if: always()`, and passes only when every
# shard succeeded and the run reached it inside the pre-merge budget
# (scripts/pre_merge_budget.py). The shards run side by side, so the slowest one, not
# their sum, sets the time.
#   - REQUIRED "bazel semantic-drift gate + test parity" (`bazel`): `bazel-drift` — the
#     BUILD semantic-drift gate and the target table; `bazel-test-proxy` and
#     `bazel-test-rest` — every non-manual test target, in two shards whose union is
#     `//...` by construction — with, in `bazel-test-proxy`, the workspace-lints
#     membership gate and its probe and the ADR-MCPRE-061 clippy debt ratchet, and in
#     `bazel-test-rest`, the lint lane (clippy under //bazel:workspace_lints, warnings as
#     errors) and the format lane. Live-infra e2e tests skip themselves while their
#     MCP_RE_TEST_* variables are unset.
#   - REQUIRED "feature-gated backend tests (Bazel)" (`release-gates`): the ADR-MCPRE-051
#     §7 release gates as named Bazel test lanes, the load harness's Docker tests and the
#     saturation rig's liveness check, in `release-race` and `release-harness`.
#   - REQUIRED "Bazel build + test" (`required`): the repository's structural gates in
#     `rust`, `gates-2` and `gates-3`, and the assurance platform's self-tests in
#     `selftests-1`, `selftests-2` and `selftests-bazel`. They build nothing.
#   - BLOCKING (ADR-MCPS-048 / MCPS-71): the `sdk-python` and `sdk-typescript` jobs
#     build each SDK's published artifact — the wheel, the npm package — with its native
#     module from Bazel, install it into a clean environment (fresh venv / empty npm
#     project), and run the SDK test suite against it.
#
# The budget is 4 minutes end to end. Every pull-request job carries `timeout-minutes: 4`,
# and the three required checks measure the run itself. `bazel-cache` runs on main only,
# after a merge, and saves the cache every shard restores.
#
# Pre-merge: every pull request. post-merge.yml calls this workflow on main after a merge.
# Public repository, so every job runs on a GitHub-hosted runner.
name: pre-merge

on:
  pull_request:
  workflow_call:

# Cancel superseded runs on the same ref. `github.workflow` is the CALLER's name in a called workflow, so
# post-merge and weekly do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The structural gates, in three shards that run side by side. Each shard checks out the
  # full history, because the ratchets read `origin/main`. None of them is a required check
  # on its own: `required` below carries the required name and passes only when every shard
  # passed, inside the pre-merge budget.
  rust:
    name: structural gates (1/3)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      # Full history: the module-size ratchet checks DISPOSITION TRANSITIONS against
      # `origin/main:config/module-size-debt.toml`, and at depth 1 that ref does not
      # exist. The gate prints "no baseline registry at origin/main" rather than
      # silently passing, so a shallow clone would be visible — but a check that
      # announces it could not run is still a check that did not run.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up the pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # JCS vocabulary firewall (D1 of the active-profile/legacy-quarantine note):
      # forward-design docs must not frame a live "object profile + HTTP profile"
      # world. Fast, python-only — fails before the slow build.
      - name: JCS vocabulary firewall (deprecated-profile framing gate)
        run: |
          python3 scripts/jcs_vocabulary_gate.py --selftest
          python3 scripts/jcs_vocabulary_gate.py

      # Port-registry staleness gate: config/ports.toml is the single source of
      # truth for every port this repo binds (reserved band 8600-8699). The Helm
      # bindPort mirror must equal it and no registered port may fall outside the
      # band. Fast, python-only — fails before the slow build.
      - name: Port-registry gate (single-source ports, no drift)
        run: |
          python3 scripts/check_port_registry.py --selftest
          python3 scripts/check_port_registry.py

      # SEP-2322 discriminator gate: the conformance suite pins the discriminator's
      # VALUE, but that only protects readers that classify through the shared
      # helper. The literal had been open-coded in five places, three of which read a
      # malformed non-terminal reply as terminal — so a rename would have failed the
      # value guard while leaving those readers silently wrong. This asserts the
      # literal appears in exactly one shipped source file, which is the only way to
      # catch a sixth copy: a type system cannot notice a string nobody imported. It
      # is a script rather than a test because `sdk/` is not Bazel-addressable.
      # Fast, python-only.
      - name: Discriminator gate (one classifier, no open-coded copies)
        run: |
          python3 scripts/discriminator_gate.py --selftest
          python3 scripts/discriminator_gate.py

      # Tracked-file leak guard: key material, credential documents, and personal
      # or concrete service-account identifiers must never land in a tracked file
      # (a commit is public history even after a later commit deletes it). The
      # selftest runs first — a detector that silently matches nothing looks
      # exactly like a clean tree. Fast, python-only.
      - name: Tracked-secrets gate (no committed credentials or personal identifiers)
        run: |
          python3 scripts/tracked_secrets_gate.py --selftest
          python3 scripts/tracked_secrets_gate.py

      # The CodeBuild `pre_build` context guard rests on one premise: every path it
      # refuses is one `git archive HEAD` cannot emit. `.claude` is partly TRACKED —
      # eight files — so the guard aborted every correctly produced upload and detected
      # no zipped working tree at all. The premise is a local fact that `git ls-files`
      # decides, so it is checked rather than remembered.
      - name: CodeBuild context-guard gate
        run: |
          python3 scripts/codebuild_guard_gate.py --selftest
          python3 scripts/codebuild_guard_gate.py

      # Deploy image-tag gate: Cloud Build pushes the image tags, and the k8s
      # manifests, chart and live-validation harnesses reference them. Nothing tied
      # those together, so they drifted a whole release apart — the multi-replica
      # harness deployed `:0.12.1` while Cloud Build published `:0.13.0`. Every pin
      # reads correctly in isolation; the mismatch only shows up as ImagePullBackOff
      # on a cluster that is already billing. Selftest first: a scanner that matches
      # nothing is indistinguishable from a clean tree. Fast, python-only.
      - name: Deploy image-tag gate (every deployed tag == VERSION)
        run: |
          python3 scripts/deploy_image_tag_gate.py --selftest
          python3 scripts/deploy_image_tag_gate.py
          python3 scripts/fixture_feature_gate.py --selftest
          python3 scripts/fixture_feature_gate.py

      # OS-entropy census gate: `boundary.os_entropy` names exactly the production files
      # that acquire OS entropy through `getrandom`. ASM-0068 states that count and requires
      # owner review of a new site; the count was kept by hand and went stale once. Fast,
      # python-only.
      - name: OS-entropy census gate (boundary.os_entropy names every acquisition site)
        run: |
          python3 scripts/os_entropy_census_gate.py --selftest
          python3 scripts/os_entropy_census_gate.py

      # SDK wire-code gate: every `mcp-re.*` token the Python and TypeScript SDKs spell is
      # the wire code of a verdict `ALL_ERRORS` lists. The SDKs spell these by hand, and two
      # test fixtures had modelled receipts carrying codes no server emits. Fast, python-only.
      - name: SDK wire-code gate (every SDK `mcp-re.*` token is a frozen wire code)
        run: |
          python3 scripts/sdk_wire_code_gate.py --selftest
          python3 scripts/sdk_wire_code_gate.py --probe
          python3 scripts/sdk_wire_code_gate.py

      # Finding-ledger gate: every ledger row carries a disposition the taxonomy can
      # close, or it is counted open. `accepted-risk` / `wontfix` are refused, a premise
      # names a registered ASM, a constraint names the owner ruling that accepted it.
      # 187 uncounted accepted-risk rows once hid eight live defects. Fast, python-only.
      - name: Finding-ledger gate (no accepted-risk; open count is every row not validly closed)
        run: |
          python3 scripts/finding_ledger_gate.py --selftest
          python3 scripts/finding_ledger_gate.py

      # Doc-path gate: refuses a path-like token in current text that does not resolve
      # to a file of this repository, and — the rule the whole class turns on — one that
      # resolves ONLY to a gitignored path. Fifteen citations of a `work/`-local design
      # note shipped inside production source that way: correct on the author's disk and
      # nowhere else. `config/doc-path-debt.toml` holds the population it landed over and
      # may only shrink. Fast, python-only.
      - name: Doc-path gate (current text names no path the repository lacks)
        run: |
          python3 scripts/doc_path_gate.py --selftest
          python3 scripts/doc_path_gate.py

      # Bazel srcs gate: mcp-re-proxy hand-lists its library sources (three feature
      # flavors share one list) while every other crate globs. A hand-list drifts —
      # `src/audit_sink.rs` shipped with the ADR-MCPS-035 audit surface and was never
      # added, so cargo built a module Bazel could not find (E0583) and every Bazel
      # target downstream of the proxy failed. Only a full `bazel test //...` caught
      # it, 30+ minutes in. This is the same check in one second. Fast, python-only.
      # The module tree both hand lists are checked against — the library srcs and the
      # audit-vocabulary guard's source trees — is `_module_tree.py`'s, rustc's rules, read
      # from the production view `_rust_source.py` owns.
      - name: Bazel srcs gate (hand-listed srcs and source trees match the module tree)
        run: |
          python3 tools/verification/_rust_source.py --selftest
          python3 tools/verification/_module_tree.py --selftest
          python3 scripts/bazel_srcs_gate.py --selftest
          python3 scripts/bazel_srcs_gate.py

      # ADR-MCPRE-067 §16.3, §21.2. A new provider adds one typed mechanism payload,
      # one tagged variant and one adapter — never a provider-qualified sibling field
      # beside the selector on `DeploymentRequest`. That shape is what the Phase-2
      # migration removed: 17 siblings whose meaning depended on a `key_source`
      # discriminator, plus a nine-entry table of "belongs to a different custody
      # source" refusals explaining why a request did not mean what it said. The gate
      # reads that one struct and states which families it is NOT yet checking, so a
      # phase that has not run cannot be mistaken for a boundary that is clean.
      - name: Semantic-altitude gate (no provider sibling on DeploymentRequest)
        run: |
          python3 scripts/semantic_altitude_gate.py --selftest
          python3 scripts/semantic_altitude_gate.py

      # Helm chart render gate: every fail-closed guard in the chart
      # (`templates/_helpers.tpl`) is a render-time `fail`, and several of them key
      # on values Helm treats as FALSY — so an inverted condition does not error, it
      # omits a flag, and an omitted flag is the permissive default. This renders
      # the chart under a matrix and asserts which value sets MUST be refused, that
      # each refusal names the value at fault, and that the rendered argv omits the
      # flags it must omit (no --signing-key-seed under KMS custody, no
      # --max-in-flight when unset). Fast, python + helm.
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Helm chart render gate (fail-closed guards must refuse)
        run: |
          python3 scripts/helm_render_gate.py --selftest
          python3 scripts/helm_render_gate.py

      # The selftests of gates whose real run needs Bazel, the network or a disposable
      # checkout. Each injects the defect its gate exists to catch and proves red, with none
      # of those, so a gate edited into permissiveness fails here before the slow jobs.
      - name: Gate selftests (gazelle drift, lint membership, target table, evidence graph, Verus install, negative controls)
        run: |
          python3 scripts/bazel_gazelle_gate.py --selftest
          python3 scripts/workspace_lints_gate.py --selftest
          tools/verification/rust-targets --selftest
          tools/verification/evidence-graph --selftest
          python3 scripts/install_pinned_verus.py --selftest
          python3 scripts/hosted_negative_controls.py --selftest

      # ES256 containment (ADR-MCPRE-054): ECDSA P-256 is admitted for SCITT receipt
      # verification and nowhere else — request and response signing stay Ed25519.
      # This was the one stage-1 structural gate that ran only in `local_gate.sh`, so
      # a PR that never ran the local gate could widen the containment unnoticed.
      - name: ES256 containment gate
        run: |
          python3 scripts/es256_containment_gate.py --selftest
          python3 scripts/es256_containment_gate.py

      # Owned workers (ADR-MCPRE-056 §9): a long-lived thread must belong to a
      # `WorkerSet`. Four detached startup threads shipped before this existed, and the
      # fourth was found by accident after a survey that swept one file and concluded
      # there were three — the invariant does not survive as a habit.
      - name: Owned-worker gate
        run: |
          python3 scripts/owned_worker_gate.py --selftest
          python3 scripts/owned_worker_gate.py

      # Seam posture (ADR-MCPRE-056 §5.4): every optional capability states ON or OFF at
      # startup. `assert_complete` is the runtime backstop but no hermetic config reaches
      # the posture phase, so in the default lanes this gate is the only thing that
      # catches a seam added without a declaration.
      - name: Seam-posture gate
        run: |
          python3 scripts/seam_posture_gate.py --selftest
          python3 scripts/seam_posture_gate.py

      # ADR-MCPRE-064 (#619): direct-TLS serving resolves identity from the AUTHENTICATED
      # peer. The defect this catches reintroduces itself by WIDENING A SIGNATURE — "pass
      # the leaf too, we already have it" — which no existing control notices, because
      # each one still measures a true thing about a correctly-composed value.
      - name: Serving-identity provenance gate
        run: |
          python3 scripts/serving_identity_provenance_gate.py --selftest
          python3 scripts/serving_identity_provenance_gate.py
          python3 scripts/authorization_provenance_gate.py --selftest
          python3 scripts/authorization_provenance_gate.py
          # ADR-MCPRE-066 Slice 0/1: a refusal carries its authority, not a rendered token;
          # PolicyError has no route into the Core taxonomy; and the record states each
          # authority's outcome in its own coordinate.
          python3 scripts/refusal_provenance_gate.py --selftest
          python3 scripts/refusal_provenance_gate.py
          # THM-0051: the serving path verifies once and holds THAT product. The seam is a
          # gate rather than a type because `VerifiedMcpRequest` must keep public fields for
          # the Verus obligation on `prepare_http_dispatch` to read one.
          python3 scripts/serving_product_provenance_gate.py --selftest
          python3 scripts/serving_product_provenance_gate.py

      # A guide that teaches a flag the CLI no longer parses sends an operator to debug
      # their own environment. Only command lines that LAUNCH the proxy are scanned, so
      # prose may still name a removed flag in order to say it was removed.
      - name: Proxy-flag documentation gate
        run: |
          python3 scripts/proxy_flag_doc_gate.py --selftest
          python3 scripts/proxy_flag_doc_gate.py

      # Conformance is executable evidence, not documentation. An advertised category
      # whose corpus or harness has been deleted keeps claiming coverage that exists
      # nowhere, and a corpus with no harness is never executed — neither direction is
      # self-announcing, so both are asserted here.
      - name: Conformance-claims gate
        run: |
          python3 scripts/self_hosted_docker_gate.py --selftest
          python3 scripts/self_hosted_docker_gate.py
          python3 scripts/conformance_claims_gate.py --selftest
          python3 scripts/conformance_claims_gate.py

      # Named release-gate lanes are a table of test-target labels, and consolidating
      # the proxy suites once broke 24 of them across four workflows and two example
      # scripts. Only four went red — the cloud-KMS and several live-infra lanes are
      # gated, so their breakage would have surfaced the next time someone ran a
      # billed nightly. This asserts every `bazel test` label is a test target of the
      # build graph and every `module::` filter names a real module, before either is
      # invoked.
      - name: Test-target gate
        run: |
          python3 scripts/test_target_gate.py --selftest
          python3 scripts/test_target_gate.py

      # Every `#[test]` in the tree is reachable from a crate root some Bazel `rust_test`
      # compiles: a `tests/*.rs` with no target, or a module no root declares, holds tests
      # nothing ever runs while every lane stays green. The compiled half — a test a
      # `cfg(feature)` compiles out of every flavor — is test-inventory.yml, weekly.
      - name: Test-inventory gate (static)
        run: |
          python3 scripts/test_inventory_gate.py --selftest
          python3 scripts/test_inventory_gate.py

      # The audit scalar refuses every Unicode format control (Cf); the Rust range table that
      # says which codepoints those are is compared with `unicodedata`, so the verdict is the
      # pinned interpreter's Unicode version, set up at the top of this job.
      - name: Format-control table gate
        run: |
          python3 scripts/format_control_table_gate.py --selftest
          python3 scripts/format_control_table_gate.py

      # Rust build and test execution is Bazel's. A workflow step, script, hook, lane,
      # harness or maintained command that invokes `cargo` — directly, or through a
      # wrapper such as `maturin build` or `charon cargo` — is a second execution authority
      # whose results the Bazel graph never sees.
      - name: No-Cargo-execution gate
        run: |
          python3 scripts/no_cargo_execution_gate.py --selftest
          python3 scripts/no_cargo_execution_gate.py

      # Bazel builds from `bazel/crates.lock` and `MODULE.bazel`'s `crate.spec` entries, and
      # reads no Cargo file; the Cargo manifests and locks remain as the crates' published
      # description. A dependency change that lands in one and not the other (a Dependabot
      # bump in a Cargo.lock, a feature added to a member's manifest) builds the OLD version
      # into every Bazel artifact while every Cargo-side check stays green. This job runs on
      # every pull request, Dependabot's included, so a lockfile change cannot merge without
      # the Bazel lock following it.
      - name: Crate-spec parity gate (Cargo locks and manifests, MODULE.bazel, bazel/crates.lock)
        run: |
          python3 scripts/crate_spec_parity_gate.py --selftest
          python3 scripts/crate_spec_parity_gate.py

      # One production rustc: MODULE.bazel's version, the toolchain lock, both Verus pins,
      # the job names and the merge-readiness fallback all name the same release.
      - name: Toolchain-version consistency gate
        run: |
          python3 scripts/toolchain_consistency_gate.py --selftest
          python3 scripts/toolchain_consistency_gate.py

      # The extraction image consumes pinned Aeneas/Charon release binaries and builds
      # neither. Stated as what the definition may contain, because a tool it built from
      # source would run Cargo behind an upstream Makefile no word scanner can see.
      - name: Extraction-image gate
        run: |
          python3 scripts/extraction_image_gate.py --selftest
          python3 scripts/extraction_image_gate.py

      # Lifecycle purity (ADR-MCPRE-056/057): `runtime_state.rs` and `exchange_state.rs`
      # are values, not behaviour. A `use` of a production module would let "is this
      # transition legal?" answer two ways on the same arguments, which is what SL-04
      # (closed transition relation) and SL-09 (monotone exchange consequence) rest on.
      # Wired here as well as in `local_gate.sh` so the merge path enforces it.
      - name: Lifecycle-purity gate
        run: |
          python3 scripts/lifecycle_purity_gate.py --selftest
          python3 scripts/lifecycle_purity_gate.py



  gates-2:
    name: structural gates (2/3)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      # Full history, as in `rust`: the ratchets and the closure records read it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up the pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # Merge readiness — the authority that decides whether a candidate may merge. ONLY
      # its selftest runs here, and that is the whole of what CI can establish about it:
      # the gate asks whether this commit's required lanes have COMPLETED, so a job
      # running inside those same lanes would be asking about itself and would answer
      # NOT_READY every time by construction.
      #
      # What the selftest establishes is the part that can go wrong silently. The gate's
      # value is entirely in the shapes it REFUSES — queued, missing, null conclusion,
      # green-at-another-SHA — and a predicate that has quietly stopped refusing them
      # prints exactly what a working one prints. The catalogue drives every such shape
      # through the real decision function and fails if any reads as READY, plus the
      # structural claims: a lane no workflow runs must refuse rather than resolve empty,
      # and a workspace build-input change must widen to every unit.
      - name: Merge-readiness gate
        run: |
          python3 scripts/merge_readiness_gate.py --selftest
          python3 scripts/merge_verified_pr.py --selftest

      # ADR-MCPRE-061 §5 — THE TWO RATCHETS. Both existed and neither ran on the merge
      # path: `scripts/local_gate.sh` was their only caller, so a PR that did not run the
      # local gate could grow a registered file or a lint baseline and nothing would say
      # so. That is not hypothetical — it happened, and the campaign that found it was the
      # one that had caused it. This is the same repair ci.yml already applied to the ES256
      # containment gate and the lifecycle-purity gate, for the same stated reason: wired
      # here as well as in `local_gate.sh` so the MERGE path enforces it.
      #
      # `--selftest` first in each case: a ratchet that has stopped measuring reports the
      # same "OK" as one that measures and finds nothing.
      #
      # NOTE ON THE BASELINES. `config/clippy-debt.toml` was emitted on a developer's macOS
      # machine, so `#[cfg(target_os = "linux")]` code was never counted into it. Running
      # the gate on this Linux runner is the first time those sites have been measured at
      # all — the first green run here is the real baseline, and a difference on this
      # runner is a MEASUREMENT that was missing, not necessarily a regression.
      #
      # Five ratchets read their register and its `origin/main` baseline through
      # `_ratchet.py`, which keeps "git could not answer" apart from "no register at the
      # base"; its selftest runs first, before any gate that relies on that distinction.
      - name: Module-size ratchet (ADR-MCPRE-061 §5.1)
        run: |
          python3 tools/verification/_ratchet.py --selftest
          python3 scripts/module_size_gate.py --selftest
          python3 scripts/module_size_gate.py

      # A unit's `paths` is the source closure its ReviewFingerprint is taken over. A file
      # that leaves that closure — renamed, or carved out into a new sibling — leaves the
      # unit deriving a fingerprint over less code than before, with every claim above it
      # still answering FRESH. `bazel_srcs_gate.py` walks the same module tree but answers
      # for a library target's srcs, and the manifest loader checks only declared ⇒ exists.
      # This is the other direction, and three splits had already escaped through it.
      - name: Unit-closure gate (UC-1/UC-2/UC-3)
        run: |
          python3 scripts/unit_closure_gate.py --selftest
          python3 scripts/unit_closure_gate.py

      # The heavy local lanes (SLO, kind) refuse to start below a declared free-space
      # floor, so that a full Docker VM stops presenting itself as `PROOF FAILED` on a
      # proof that never ran — twice during v0.17. Only the `--selftest` runs here: the
      # floors describe a developer box, and this runner holds none of the probe images.
      # What CI establishes is that the ADJUDICATION still adjudicates.
      - name: Heavy-lane disk preflight (adjudication selftest)
        run: python3 scripts/heavy_lane_disk_preflight.py --selftest

      # The local gate may not reach a cloud. Stage 5's fleet proofs and Job-spec rehearsal
      # are provider-neutral by construction (provisioning lives in drivers the local closure
      # does not reach); this refuses a provider CLI, credential or registry anywhere in the
      # closure of local_gate.sh. The three selftests after it are the units that split made
      # testable: the Proof 4 pod selector, the literal Job template, the cloud renderer.
      - name: Provider-neutral local closure + harness units
        run: |
          python3 scripts/provider_neutral_closure_gate.py --selftest
          python3 scripts/provider_neutral_closure_gate.py
          python3 docs/security/fleet_pod_select.py --selftest
          python3 tools/slo/render_slo_job.py --selftest
          python3 tools/cloud/render_cloud_config.py --selftest
          python3 tools/perf/lightsail/ceiling.py selftest

      # ADR-MCPRE-059. What starts exhaustive verification is a contract: the complete run
      # (`verification.yml`) starts only on its schedule or a dispatch, never on a pull
      # request or a push, and the bounded mutation probe is capped and timed.
      # `verification_trigger_gate.py` holds the workflows to that, with negative controls for
      # a MODULE.bazel change, a toolchain update and a platform change. It must not live only
      # inside a workflow it polices, so it runs here, in the unconditional job, for the same
      # reason the two ratchets above do — the merge path is what has to enforce it.
      - name: Verification trigger gate (only schedule or dispatch starts a complete run)
        run: |
          # The one reader every workflow gate reads through: its syntax cases first, then
          # every workflow in the tree, so a construct it cannot read fails here by name
          # rather than as a gate that measured less than it claims.
          python3 scripts/workflow_reader.py --selftest
          python3 scripts/workflow_reader.py
          python3 scripts/verification_trigger_gate.py --selftest
          python3 scripts/verification_trigger_gate.py
          # The one reader of the toolchain lock, whose runtime-pin shape both runtime
          # gates below and both matrix installers apply.
          python3 tools/verification/_toolchains.py --selftest
          # The Python support claim may not exceed the Python evidence — #746. Here as
          # well as in the local gate, because a control that lives only in local_gate.sh
          # is a control enforced by remembering to run it.
          python3 scripts/python_runtime_gate.py --selftest
          python3 scripts/python_runtime_gate.py
          # The Node half of the same rule — #747.
          python3 scripts/node_runtime_gate.py --selftest
          python3 scripts/node_runtime_gate.py

      # R9 linkage. `verification/reviews/r9-dispositions.json` is the authoritative
      # per-row ownership map for the 2026-08-31 audit, and the appendix in the packet is a
      # generated view of it. Three properties, all of which drifted at least once:
      # the appendix must match the record; every row that SURVIVED the re-derivation at
      # High or Critical must name the workstream that owns it or the change that closed
      # it; and a `merged_closure` must name a merge commit that is an ancestor of HEAD.
      # The last is why this step is in the `fetch-depth: 0` job — at depth 1 the closure
      # commits are not in the clone, and the check would be measuring the checkout rather
      # than the record. It exists because a green OPEN pull request was recorded here as a
      # merged closure and no lane could tell the difference: the evidence for "merged" was
      # a sentence saying so. No network — PR state is remote and mutable, the commit
      # reachable from HEAD is the durable local fact.
      # THE MERGE-PATH CLASS ITSELF. A security/assurance control the assurance model
      # relies on must be mechanically present on the required merge path; existence in
      # `scripts/local_gate.sh` — an aggregate a developer chooses to run — does not
      # establish enforcement. That class has opened five times in this repository (the
      # two ADR-MCPRE-061 ratchets, the verification-trigger gate, the registry-approval
      # gate, and the ten platform self-test suites below), and each instance was repaired
      # only when someone noticed. This gate is what notices, so it goes first.
      - name: Merge-path gate (a local-only control is not enforced)
        run: |
          python3 scripts/merge_path_gate.py --selftest
          python3 scripts/merge_path_gate.py



  gates-3:
    name: structural gates (3/3)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      # Full history, as in `rust`: the ratchets and the closure records read it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up the pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # A GATE'S VERDICT AND ITS EXIT STATUS ARE ONE FACT. Both are correct at the source
      # — `local_gate.sh` prints exactly one `LOCAL GATE:` line and exits non-zero — and
      # they come apart in the INVOCATION: `gate | tail` reports tail's status, and
      # `gate > log; grep X log` reports grep's, so a run that failed at stage 1 reads as
      # a pass. The second form is the subtler one because it keeps the output and even
      # prints the verdict, and it is the one that happened. `run_gate.sh` is the
      # invocation that cannot lose the status; its selftest injects a failing stage
      # followed by a successful reporting step and proves the wrapper still exits
      # non-zero — and separately proves the bare form does read 0, so the case measures
      # the difference rather than restating that 1 is not 0.
      - name: Gate exit-status wrapper (a verdict and a status are one fact)
        run: scripts/run_gate.sh --selftest

      # The decision the three required checks make over their shards: anything but
      # `success` from a shard fails, and so does a run past the budget or one that could not
      # be measured.
      - name: Pre-merge budget (selftest)
        run: python3 scripts/pre_merge_budget.py --selftest

      # The TypeScript battery is measured on one prepared environment per PINNED Node
      # version. Those are build products, the nightly reclaim removes them, and the lane
      # then measures nothing while naming a directory rather than the prerequisite. The
      # preflight provisions them from the lock; this checks the question it asks is the
      # right one — an empty runtime directory left behind by a reclaim must still count
      # as absent.
      - name: Pinned Node runtime state (the lane's prerequisite is a fact, not a memory)
        run: python3 scripts/node_matrix_state.py --selftest

      # The ADR-MCPRE-068 evidence-class census. A REPORT, not a gate — it states no
      # verdict and fails nothing — which is exactly why its selftest is required: the
      # figures the Phase-0 handoff quotes are computed rather than transcribed, and a
      # census that printed the same number whatever the registry said would be a
      # sentence with a number in it. Each case perturbs a synthetic registry and
      # requires the measurement to move, including the DIRECT-vs-CLOSURE distinction
      # that makes "7 of 12 roots" and "3 of 12 roots" two different true statements.
      - name: Evidence-class census selftest (a figure that cannot move is not a measurement)
        run: tools/verification/evidence-class-census --selftest

      # ADR-MCPRE-069 — the mirror census: controls that RUN and that no proposition
      # claims. The selftest comes first and is the reason a later "0 unclaimed" is worth
      # anything: ADR-069's own first measurement was Rust-only and blind to doctests,
      # Python, TypeScript and gate carriers, so it reported a clean sweep over a
      # population missing whole control kinds. One NAMED control per ecosystem must be
      # discovered, and removing a registration must make its control read as unclaimed.
      #
      # Then two DIFFERENT facts. `--gate` refuses what is wrong inside the tree: a
      # `tested_symbols` selector that names no control (the lane selects with `--exact`,
      # so it would fail), a disposition about a control that is claimed or gone, a
      # `not-evidence` row whose reason nobody can look up. The ratchet holds the
      # undispositioned population against a per-file baseline, because ADR-069's closure
      # is a campaign and a gate that failed on the residue would be pressure to
      # bulk-register — which ADR-069 D2 forbids in terms.
      - name: Control census (ADR-MCPRE-069 — evidence that runs but nothing claims)
        run: |
          python3 tools/verification/test_controls.py
          tools/verification/control-census --gate
          python3 scripts/control_census_gate.py --selftest
          python3 scripts/control_census_gate.py
          # ADR-MCPRE-069's CLOSURE criterion is not the merge-time question, and
          # `--closure` is no longer run here. It carries two clauses: residue zero, and —
          # since `ratified_as` became an enforced fact — the recorded proposition
          # population zero. The first is enforced above, and printed, by the ratchet's own
          # verdict line. The second is a campaign-length debt, and a merge path red for
          # the length of a campaign is a gate nobody can act on. `--closure` states the
          # release criterion and is run at closure, by the campaign that owes it.

      # MCPRE-189. Every reference from one policy registry into another, or into the
      # tree, checked once: a mutation probe's unit, theorem, expected controls and every
      # site it weakens; a structural probe's unit and documented case; a measurement's
      # unit; an assumption's scoped units and boundaries and every seam site it registers.
      # It also holds the reader rule — no gate or tool spells a registry's path — which is
      # what makes one check enough. ~2s.
      - name: Policy-registry references (MCPRE-189)
        run: |
          tools/verification/check-registries --selftest
          tools/verification/check-registries

      # ADR-MCPRE-068 §9.4 — the class-transition ratchet. A downgrade from `proved` to
      # `tested` passes registry adequacy trivially: delete the formal URI, delete the
      # class, and nothing notices the claim got weaker. Only a comparison against the base
      # sees it, which is why it is a step of its own rather than another loader rule.
      #
      # NO FETCH. This job checks out at `fetch-depth: 0` precisely so a ratchet can read
      # `origin/main`, exactly as the module-size ratchet above already does — and the first
      # version of this step fetched anyway, with `--depth=1`. A shallow fetch into a FULL
      # clone does not add a ref; it TRUNCATES the object graph at the fetched commit, and
      # every later step that asks an ancestry question gets the wrong answer. It took the
      # R9 linkage control down with it: all 56 recorded closure commits, present in the
      # clone, suddenly unreachable from HEAD. A step that mutates the repository's history
      # is not local to itself.
      - name: Evidence-class transition ratchet (ADR-MCPRE-068 §9.4)
        run: |
          python3 scripts/evidence_class_ratchet.py --selftest
          python3 scripts/evidence_class_ratchet.py --base origin/main

      # ADR-MCPRE-068 N1 — the obligation ratchet, Phase 0E. Same `fetch-depth: 0` clone and
      # the same NO FETCH rule as the step above, for the same reason.
      #
      # It holds the 63 falsifier obligations that predate N1's activation. What makes it a
      # ratchet rather than a waiver is that it may only SHRINK and is closed to new work: a
      # proposition that gains an obligation by being added, reclassified or raised in
      # severity discharges it or fails, and `tools/verification/verify --manifests` fails on
      # the same fact independently. A registered row is not satisfied by being registered —
      # it stays INCOMPLETE, and `review` prints it as an open obligation.
      - name: N1 obligation ratchet (ADR-MCPRE-068 §9.4)
        run: |
          python3 scripts/assurance_obligation_gate.py --selftest
          python3 scripts/assurance_obligation_gate.py --base origin/main

      # ADR-MCPRE-059 §9, Phase T3. Every generated view carries `Gated by:` in its own
      # banner, and until this step existed that line named a control reachable only
      # through `verify --phase extraction` — the pinned Linux container, behind a step
      # condition on `image.outputs.resolved && required`. Six pure Markdown comparisons
      # had inherited the Lean model's preconditions and were checked by nothing whenever
      # the container was unresolved. Split out and run here, unconditionally, because the
      # proposition needs no toolchain and the banner already published the promise.
      - name: Assurance-view freshness (generated views ↔ catalogues)
        run: |
          ./tools/verification/check-views --selftest
          ./tools/verification/check-views

      # ADR-MCPRE-059 §28 + the ratified security boundary. The registry's `root_theorems`
      # and `docs/spec/security-boundary.md` §2 are ONE fact — what MCP-RE promises —
      # written down twice, and they had diverged: twelve declared roots against nine
      # published claims, three roots simultaneously claimed and disclaimed, three §4 rows
      # duplicated with different dispositions, and a hand-written root-completeness count
      # that disagreed with the tool. Nothing failed, because no control related the two.
      # This is that control. It checks the MAPPING and the review axis only: evidence
      # freshness lives in a gitignored attestation store that no merge-path job can read.
      - name: Claim-surface gate (declared roots ↔ published claims)
        run: |
          python3 scripts/claim_surface_gate.py --selftest
          python3 scripts/claim_surface_gate.py

      # ADR-MCPRE-059 §28.8. `review --require-root-complete` is the BINDING closure mode
      # and it is deliberately NOT run here: an honest unresolved GAP under a declared root
      # must not fail ordinary development, or the incentive becomes to leave the
      # obligation unrecorded. What IS checked here is that the mode has a caller at all.
      # Measured 2026-09-14: it had ZERO — not one shell script, not one workflow — and had
      # been run by hand for v0.16 and v0.17 with its verdict typed into a provenance
      # document. Same class as `too-many-lines-threshold` parameterising a lint nobody
      # switched on, and as the documented SLO-Job rehearsal with no caller.
      - name: Release-assurance gate (the closure mode has a caller)
        run: |
          python3 scripts/release_assurance_gate.py --selftest
          python3 scripts/distribution_gate.py --selftest
          python3 scripts/release_assurance_gate.py
          python3 tools/verification/release-assurance --selftest

      # ADR-MCPRE-059 §14.7 — approval is evidence ABOUT a fingerprint, never a bit on the
      # object approved. This gate had `scripts/local_gate.sh` as its only caller, and it
      # was RED on main while every CI check was green: `r9-dispositions.json` landed under
      # verification/reviews/ carrying a `status` key and naming no fingerprint, and nothing
      # on the merge path asked. Same repair, same reason, as the two ratchets above.
      - name: Registry approval gate (ADR-MCPRE-059 §14.7)
        run: |
          python3 scripts/registry_approval_gate.py --selftest
          python3 scripts/registry_approval_gate.py

      - name: R9 linkage controls (merged means merged)
        run: |
          python3 tools/verification/test_r9_linkage.py
          python3 tools/verification/render-r9-dispositions --check

      # The clippy ratchet needs the toolchain, so it runs with the clippy lanes below.

      # The SCITT service-key fetcher refuses a plaintext redirect hop. `build_opener`
      # installs the permissive default redirect handler unless it is passed a
      # subclass, so a guard class that exists but is never consulted leaves the
      # downgrade open — the selftest asserts the wiring, not just the class.
      - name: SCITT service-key fetch guards
        run: python3 tools/scitt_fetch_service_key.py --selftest

      # MCPRE-427 (#415 rev 2 §12.2). The hash/digest checks themselves run inside
      # the `bazel-test-*` shards' `bazel test` (corpus_pinning_test + the frozen runners,
      # which fail closed before running a vector whose bytes drifted). This step
      # PUBLISHES the resulting digests into the job summary so a release packet —
      # and any reviewer — can quote the exact corpus that was tested, rather than
      # a tag, which §12.2 says is insufficient to prove two parties read the same
      # bytes.
      - name: Publish conformance corpus digests
        run: |
          {
            echo "## Conformance corpus digests (§12.2)"
            echo
            echo '| Corpus | manifest SHA-256 | corpus digest |'
            echo '|---|---|---|'
            for c in http-profile delegation-profile scitt; do
              m="mcp-re-conformance/tests/vectors/$c/manifest.json"
              manifest_sha="$(shasum -a 256 "$m" | cut -d' ' -f1)"
              corpus_dig="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['corpus_digest'])" "$m")"
              echo "| \`$c\` | \`$manifest_sha\` | \`$corpus_dig\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"



  selftests-1:
    name: assurance platform self-tests (1/2)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      # Full history, as in `rust`: the ratchets and the closure records read it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up the pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # The assurance platform's own self-tests — the verdict algebra, the invalidation
      # rules, the measured-input closure, the escape-hatch detector, the theorem loader
      # and review model, the test and Verus lane adapters, and the views generator. They
      # are what establishes that a `verify` verdict means what ADR-MCPRE-059 says it
      # means, and every product claim rests on that. They ran in `local_gate.sh` and
      # nowhere else, so nothing on the merge path established it.
      #
      # Two shards, balanced by measured time, so the slowest suite rather than their sum
      # sets the job's length; `required` reports each shard's time on every run.
      #
      # Spelled out one per line rather than looped over a variable: `merge_path_gate.py`
      # reads literal paths, and a name a workflow assembles at run time is a name it
      # cannot see. A control that is enforced but not legible to the checker is how the
      # next instance of this class would be missed.
      - name: Assurance platform self-tests (ADR-MCPRE-059) — 1/2
        run: |
          python3 tools/verification/_lanes.py --selftest
          python3 tools/verification/test_verdict_algebra.py
          python3 tools/verification/test_theorems.py
          python3 tools/verification/test_claim_corrections.py
          python3 tools/verification/test_extraction_identity.py
          python3 tools/verification/test_extraction_artifact.py
          python3 tools/verification/test_compose.py
          python3 tools/verification/test_scoped_verification.py
          python3 tools/verification/test_lean_axioms.py
          python3 tools/verification/test_lean_model.py
          # ADR-MCPRE-068 Phase 0A. Listed here rather than left to a glob for the
          # reason the comment above gives: `merge_path_gate.py` reads literal paths,
          # so a suite a workflow assembles at run time is one it cannot see.
          python3 tools/verification/test_evidence_class.py
          python3 tools/verification/test_invalidation.py
          python3 tools/verification/test_theorem_review.py
          python3 tools/verification/test_views.py



  selftests-2:
    name: assurance platform self-tests (2/2)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      # Full history, as in `rust`: the ratchets and the closure records read it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up the pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # The assurance platform's self-tests, shard 2/2 (see `selftests-1`).
      - name: Assurance platform self-tests (ADR-MCPRE-059) — 2/2
        run: |
          python3 tools/verification/test_ecosystems.py
          python3 tools/verification/test_measured_inputs.py
          python3 tools/verification/test_attest.py
          python3 tools/verification/test_verus_lane.py
          python3 tools/verification/test_test_lane.py
          python3 tools/verification/test_escape_hatches.py
          python3 tools/verification/test_evidence_bundle.py
          # Added by the v0.17 Slice B sweep. It was in NEITHER local_gate.sh nor any
          # unconditional workflow: `mutation-probe.yml` names it, and that workflow is
          # `paths:`-filtered, so the mutation lane's verdict semantics were established
          # only on pull requests that happened to trip the filter. `merge_path_gate.py`
          # could not see it, because "named by a workflow" was treated as coverage
          # whatever the trigger. Both halves are fixed.
          python3 tools/verification/test_mutation_lane.py
          # A cited control must be compiled by the target that cites it: a unit naming a
          # feature-gated module's test in a target built without the feature measures nothing.
          python3 tools/verification/test_feature_lanes.py
          # #1172. Which runs may close assurance and what closing requires, and that
          # verification.yml's closure job calls the authority rather than counting axes.
          tools/verification/assurance-closure --selftest
          python3 tools/verification/test_assurance_closure.py
          # #1173. A committed closure record is well formed, its digests are the digests
          # of the identities it lists, and its target commit resolves to its target tree.
          tools/verification/closure-record --selftest
          python3 tools/verification/test_closure_record.py
          tools/verification/closure-record --verify
          # ADR-MCPRE-068 Phase 0C. The premise ontology, and the composition §7 found
          # missing: which typed premises each declared root ultimately rests on. Both ends
          # of that join carry `unit://` URIs, and comparing them verbatim reported that no
          # root rests on any premise — an empty join reads exactly like a clean tree, so
          # the suite asserts the count is non-zero rather than only that it runs.
          python3 tools/verification/test_premise_class.py

          # ADR-MCPRE-068 N3 — the severity derivation, Phase 0E. `effective_severity` is
          # derived and never stored, which is only worth more than a stored field if the
