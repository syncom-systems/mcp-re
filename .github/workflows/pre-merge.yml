  rfc9421-cross-verify:
    name: RFC 9421 third-party cross-verification (no-merge gate)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    # ADR-MCPRE-050 / MCPRE-99: the HTTP-profile corpus MUST validate through a
    # pinned, INDEPENDENT RFC 9421 implementation (python-cryptography Ed25519),
    # both ways — our signatures verify externally, and an externally produced
    # signature verifies under the Rust verifier. No external validation, no
    # merge; this gate is required before full-profile parity is declared green.
    steps:
      - uses: actions/checkout@v7

      - name: Set up the pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install pinned external RFC 9421 dependency
        run: pip install -r mcp-re-conformance/tools/requirements-cross-verify.txt

      # Direction 1: our committed vectors verify under the independent impl,
      # and h01's reconstructed signature base is byte-compared to the oracle.
      - name: Cross-verify the HTTP-profile corpus (ours → external)
        run: python3 mcp-re-conformance/tools/rfc9421_cross_verify.py

      # The emitted external vector must match what is committed (drift guard for
      # the external → us direction the Rust test consumes).
      - name: External vector is up to date
        run: |
          python3 mcp-re-conformance/tools/rfc9421_cross_verify.py --emit-external-kat
          git diff --exit-code mcp-re-conformance/tests/vectors/http-profile/external_kat.json

      - uses: actions/checkout@v7

      - name: Restore Bazel cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'bazel/crates.lock') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'bazel/crates.lock') }}-
            bazel-${{ runner.os }}-

      # Direction 2: the externally produced signature verifies under the Rust
      # MCP-RE verifier.
      - name: Cross-verify (external → us) under the Rust verifier
        run: >-
          scripts/run_test_lane.sh bazel test --test_output=all --nocache_test_results
          //mcp-re-conformance:rfc9421_cross_verification_test

      # ADR-MCPRE-052 §9 (MCPRE-122): the same two-direction gate for the compact-
      # JWS delegation credential, against an independent JOSE/EdDSA impl.
      # Direction 1: our committed delegation credential verifies under
      # python-cryptography and is byte-identical to its independent build.
      - name: Cross-verify the delegation credential (ours → external)
        run: python3 mcp-re-conformance/tools/jose_cross_verify.py

      - name: External delegation vector is up to date
        run: |
          python3 mcp-re-conformance/tools/jose_cross_verify.py --emit-external-kat
          git diff --exit-code mcp-re-conformance/tests/vectors/delegation-profile/external_delegation_kat.json

      # Direction 2: the externally produced credential verifies under the Rust
      # MCP-RE delegation verifier.
      - name: Cross-verify delegation (external → us) under the Rust verifier
        run: >-
          scripts/run_test_lane.sh bazel test --test_output=all --nocache_test_results
          //mcp-re-conformance:delegation_cross_verification_test

      # MCPRE-501: the same two-direction gate for SCITT, against RFC 9942/9943 AS
      # PUBLISHED. Its absence is why a non-conforming receipt encoding shipped: the
      # receipt used the pre-publication draft labels -111/-222 instead of vds=395 /
      # vdp=396, and every test stayed green, because the suite ran our encoder against
      # our own decoder — which agrees with itself whatever labels it picks.
      # Direction 1: our committed corpus, decoded by cbor2 and verified by
      # python-cryptography, checked against the RFC's literal header labels.
      - name: Cross-verify the SCITT corpus (ours → external)
        run: python3 mcp-re-conformance/tools/scitt_cross_verify.py

      - name: External SCITT vector is up to date
        run: |
          python3 mcp-re-conformance/tools/scitt_cross_verify.py --emit-external-kat
          git diff --exit-code mcp-re-conformance/tests/vectors/scitt/external_kat.json

      # Direction 2: statements and receipts BUILT by the independent implementation
      # must verify under the Rust verifier, and each refusal a conforming verifier owes
      # must be refused — including a draft-labelled receipt, so a regression to those
      # labels fails here instead of shipping.
      - name: Cross-verify SCITT (external → us) under the Rust verifier
        run: >-
          scripts/run_test_lane.sh bazel test --test_output=all --nocache_test_results
          //mcp-re-conformance:scitt_cross_verification_test

      # MCPRE-501 slice 4: the frozen third-party interoperability corpus — a receipt
      # produced by @transmute/cose (RFC 9942's editor's implementation: its RFC 9162
      # tree, its proof encoder, its CBOR) verified offline here, plus the mutations of
      # that receipt MCP-RE must refuse. No network and no peer install: the corpus is
      # committed octets, which is what makes the offline claim reproducible.
      #
      - name: Third-party SCITT interoperability corpus (offline verification)
        run: >-
          scripts/run_test_lane.sh bazel test --test_output=all --nocache_test_results
          //mcp-re-conformance:scitt_interop_test



  release-race:
    name: release gates — replay race, drain, inner plane, saturation liveness
    runs-on: ubuntu-latest
    timeout-minutes: 4
    # The ADR-MCPRE-051 §7 release gates as NAMED, attributable lanes (MCPRE-123). Their
    # tests also run inside the `bazel-test-*` shards' `bazel test`; naming them makes each a
    # gate whose failure is unambiguous. Each lane runs through run_test_lane.sh, which
    # refuses one that ran zero tests, with --nocache_test_results so a gate runs rather
    # than replays a cached result, and --test_output=all so the log names what ran.
    steps:
      - uses: actions/checkout@v7

      # cryptoki-sys's build script generates its FFI bindings with bindgen, which needs
      # libclang.
      - name: System build dependencies
        # The bounds on the fallback are not decoration; they are what the two earlier
        # attempts at this step were. With no bound at all, six jobs across four branches
        # sat in `apt-get update` for 28-58 minutes each reporting `pending` — which says
        # strictly less than a red would. With only `update` bounded, the `install` hung
        # instead. `Acquire::http::Timeout` does not help either: it bounds INACTIVITY,
        # and a transfer dribbling at 32 kB/s is never inactive.
        #
        # Nothing here is weakened. If the image ever stops shipping Clang the fallback
        # installs it exactly as before; a package that genuinely cannot be installed
        # still fails the step, and every gate below is untouched.
        run: |
          set -euo pipefail
          # cryptoki-sys builds its FFI bindings with bindgen, which needs libclang at
          # RUNTIME — the shared object, not the headers. The ubuntu-24.04 runner image
          # already ships Clang 18.1.3, so `libclang-dev` was re-downloading a library
          # the box already had: 28.8 MB fetched and ~292 MB unpacked, on every one of
          # three jobs, every run.
          #
          # That download is also the single least reliable thing in this workflow.
          # Measured on 2026-08-19 against the same Azure mirror, same file: 64.0 kB/s,
          # then 43.1 kB/s, then 32.1 kB/s — 14min 57s for the fetch alone, with the
          # unpack pushing past a 20-minute cap. Raising the cap is a race against a
          # mirror that keeps getting slower; not needing the file wins it outright.
          #
          # So: find what is already installed and point bindgen at it. apt is the
          # FALLBACK, not the default, and it keeps its bounds for the case where the
          # image stops shipping Clang.
          found=""
          for dir in /usr/lib/llvm-*/lib /usr/lib/x86_64-linux-gnu; do
            if compgen -G "$dir/libclang*.so*" > /dev/null 2>&1; then
              found="$dir"
              break
            fi
          done

          if [ -n "$found" ]; then
            echo "LIBCLANG_PATH=$found" >> "$GITHUB_ENV"
            echo "using the runner image's libclang in $found:"
            ls -1 "$found"/libclang*.so* | sed 's/^/  /'
          else
            echo "no libclang on the image — falling back to apt (bounded)"
            timeout 300 sudo apt-get update \
              || echo "apt-get update did not finish in 300s; using the runner image's package index"
            sudo apt-get install -y --no-install-recommends \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              libclang-dev
          fi

      - name: Restore Bazel cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'bazel/crates.lock') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'bazel/crates.lock') }}-
            bazel-${{ runner.os }}-

      # These suites share the `integration_async` binary, so each lane selects by module
      # filter, passed to libtest with --test_arg. A missing BINARY fails the build, but a
      # FILTER that matches nothing prints `0 passed` and exits 0; run_test_lane.sh refuses
      # that. The target is built with `async_serve`, which `async_replay_test.rs` and
      # `http_inner_test.rs` need: without it they compile to zero tests.

      # §4 — replay race: exactly one Fresh, N-1 Replay, zero Fresh when the store is
      # Unavailable (fail-closed). (#314)
      #
      # In-process, and the gate claims nothing more. The three requirement controls
      # drive the L2 seam over `InMemoryAsyncAtomicReplayStore` behind a double that
      # declares the durability class `replay_plane::materialized::assert_durable`
      # accepts, so the gate no longer measures an arrangement the composition root
      # refuses; it still does not measure a shipped backend. CROSS-REPLICA is
      # `replay_race_harness_test.rs` over live Redis and etcd, in
      # `live-infra-e2e.yml`, not here.
      - name: Release gate — replay race
        run: >-
          scripts/run_test_lane.sh bazel test --test_output=all --nocache_test_results
          //mcp-re-proxy:integration_async_test --test_arg=async_replay_test::

      # §6 — bounded graceful drain: in-flight requests complete, zero abandoned,
      # a stuck request cannot delay exit past the grace bound. (MCPRE-115)
      # Its own binary: it runs under RUST_TEST_THREADS=1, which the target sets.
      - name: Release gate — bounded drain
        run: >-
          scripts/run_test_lane.sh bazel test --test_output=all --nocache_test_results
          //mcp-re-proxy:async_drain_test

      # §3 — inner plane: concurrent in-flight (no serial pipe) + pool-exhaustion
      # backpressure fails closed without queuing. (MCPRE-118)
      - name: Release gate — inner-plane concurrency + backpressure
        run: >-
          scripts/run_test_lane.sh bazel test --test_output=all --nocache_test_results
          //mcp-re-proxy:integration_async_test --test_arg=http_inner_test::

      # LIVENESS of the standardized capacity instrument, not a measurement.
      #
      # The saturation rig is a Bazel binary driven by a script, so no test target
      # reaches it and no gate above can see it. When ADR-MCPRE-064 Slice 4 moved the
      # channel-binding operand to the request SUBJECT, the rig kept minting a client
      # leaf naming the composed actor id: every request it sent was refused
      # `mcp-re.transport_binding_failed` before backend dispatch, for eleven days, with
      # every check on every PR green. Nothing anywhere asked the instrument to send one
      # request.
      #
      # This asks. One core, one generator, 2000 requests, and NO throughput number — it
      # asserts zero failures, a non-zero rate and a backend CPU clock that moved. The
      # full sweep needs a quiet box and stays out of CI.
      - name: Release gate — saturation instrument liveness
        run: scripts/saturation_liveness.sh



