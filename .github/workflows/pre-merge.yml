      # `rust_lint_config`, which every `nt_rust_*` target carries by default. A target that
      # overrides it, or is written with a raw rule, is silently exempt, so the gate checks
      # every first-party Rust target in the graph; `--probe` proves the policy is ENFORCED
      # by compiling a deliberate violation of each half. A policy merely attached is the
      # configuration-enforces-nothing failure this repo has already hit twice.
      - name: Workspace-lints gate (every Rust target carries the one lint authority)
        run: |
          python3 scripts/workspace_lints_gate.py
          python3 scripts/workspace_lints_gate.py --probe

      # ADR-MCPRE-061 §6.4. The adopted lints run over every production library and binary
      # flavor, and each crate's count may only fall (config/clippy-debt.toml). The probes
      # prove the lints are switched on and the nesting threshold sits where CLAUDE.md says.
      - name: Clippy debt ratchet (ADR-MCPRE-061 §6)
        run: |
          python3 scripts/clippy_ratchet_gate.py --selftest
          python3 scripts/clippy_ratchet_gate.py --activation-probe
          python3 scripts/clippy_ratchet_gate.py --nesting-probe
          python3 scripts/clippy_ratchet_gate.py

      # The measured lane's self-test runs the registered measurement, a `bazel test`, so it
      # runs here, behind the main Bazel cache. The structural lane's runs in
      # `selftests-bazel`; ADR-MCPRE-068 Phase 0B makes the pair the two lanes' liveness.
      - name: Assurance platform self-tests (ADR-MCPRE-059) — the measured lane
        run: python3 tools/verification/test_measured_lane.py

  bazel-test-rest:
    name: bazel — test parity (rest), lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - name: Set up the pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # The FFI closure (cryptoki-sys) builds bindings with libclang, same as the
      # cargo jobs; install it so the Bazel build links on a clean runner.
      - name: System build dependencies
        # The bounds on the fallback are not decoration; they are what the two earlier
        # attempts at this step were. With no bound at all, six jobs across four branches
        # sat in `apt-get update` for 28-58 minutes each reporting `pending` — which says
        # strictly less than a red would. With only `update` bounded, the `install` hung
        # instead. `Acquire::http::Timeout` does not help either: it bounds INACTIVITY,
        # and a transfer dribbling at 32 kB/s is never inactive.
        #
        # Nothing here is weakened. If the image ever stops shipping Clang the fallback
        # installs it exactly as before; a package that genuinely cannot be installed
        # still fails the step, and every gate below is untouched.
        run: |
          set -euo pipefail
          # cryptoki-sys builds its FFI bindings with bindgen, which needs libclang at
          # RUNTIME — the shared object, not the headers. The ubuntu-24.04 runner image
          # already ships Clang 18.1.3, so `libclang-dev` was re-downloading a library
          # the box already had: 28.8 MB fetched and ~292 MB unpacked, on every one of
          # three jobs, every run.
          #
          # That download is also the single least reliable thing in this workflow.
          # Measured on 2026-08-19 against the same Azure mirror, same file: 64.0 kB/s,
          # then 43.1 kB/s, then 32.1 kB/s — 14min 57s for the fetch alone, with the
          # unpack pushing past a 20-minute cap. Raising the cap is a race against a
          # mirror that keeps getting slower; not needing the file wins it outright.
          #
          # So: find what is already installed and point bindgen at it. apt is the
          # FALLBACK, not the default, and it keeps its bounds for the case where the
          # image stops shipping Clang.
          found=""
          for dir in /usr/lib/llvm-*/lib /usr/lib/x86_64-linux-gnu; do
            if compgen -G "$dir/libclang*.so*" > /dev/null 2>&1; then
              found="$dir"
              break
            fi
          done

          if [ -n "$found" ]; then
            echo "LIBCLANG_PATH=$found" >> "$GITHUB_ENV"
            echo "using the runner image's libclang in $found:"
            ls -1 "$found"/libclang*.so* | sed 's/^/  /'
          else
            echo "no libclang on the image — falling back to apt (bounded)"
            timeout 300 sudo apt-get update \
              || echo "apt-get update did not finish in 300s; using the runner image's package index"
            sudo apt-get install -y --no-install-recommends \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              libclang-dev
          fi

      # The Bazel output base and bazelisk download, restored from the newest cache main
      # saved (same locks first, then any). Only a push to main saves one — the
      # `bazel-cache` job — so the cache follows main instead of freezing at the first build under a
      # lock hash, and a PR never uploads its own ~2.4 GB copy. The key names the locks
      # the external repositories come from, and Cargo.lock, which gazelle_rust reads.
      - name: Restore Bazel cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'bazel/crates.lock') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'bazel/crates.lock') }}-
            bazel-${{ runner.os }}-

      - name: Bazel version
        run: bazel version

      # (2) The workspace test lane, in two shards whose union is `//...` by construction:
      # this one is `//...` minus the proxy package, and `bazel-test-proxy` is that package.

      - name: Bazel test parity (//... except //mcp-re-proxy/...)
        run: bazel test --test_output=errors --profile="$RUNNER_TEMP/rest.json.gz" -- //... -//mcp-re-proxy/...
      - name: Profile of the test step (diagnostic)
        run: |
          python3 - "$RUNNER_TEMP/rest.json.gz" <<'EOF'
          import gzip, json, sys
          events = json.load(gzip.open(sys.argv[1])).get("traceEvents", [])
          spans = sorted((e for e in events if e.get("dur")), key=lambda e: -e["dur"])
          for e in spans[:40]:
              print(f'{e["dur"] / 1e6:8.2f}s  {e.get("cat", "")[:28]:28}  {e.get("name", "")[:120]}')
          EOF


      # The Rust lint lane: clippy over every first-party target under the workspace lint
      # policy (//bazel:workspace_lints) and .clippy.toml, warnings as errors.
      - name: Rust lint lane (bazel build --config=lint //...)
        run: bazel build --config=lint //...

      # rustfmt over every first-party target, check-only: a mis-formatted file fails.
      - name: Rust format lane (bazel build --config=rustfmt //...)
        run: bazel build --config=rustfmt //...



  # The required check "bazel semantic-drift gate + test parity", over its three shards.
  bazel:
    name: bazel semantic-drift gate + test parity
    if: always()
    needs: [bazel-drift, bazel-test-proxy, bazel-test-rest]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up the pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Every shard passed, inside the pre-merge budget
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pre_merge_budget.py --check "bazel semantic-drift gate + test parity"



  # The Bazel cache every PR shard restores. Saved only after a merge to main, by one job
  # that builds everything the shards and the SDK jobs build — each shard builds a part, and
  # a cache saved from one part would leave the others cold. It is not part of the pre-merge
  # budget: it never runs on a pull request.
  bazel-cache:
    name: bazel cache (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Set up the pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # The FFI closure (cryptoki-sys) builds bindings with libclang, same as the
      # cargo jobs; install it so the Bazel build links on a clean runner.
      - name: System build dependencies
        # The bounds on the fallback are not decoration; they are what the two earlier
        # attempts at this step were. With no bound at all, six jobs across four branches
        # sat in `apt-get update` for 28-58 minutes each reporting `pending` — which says
        # strictly less than a red would. With only `update` bounded, the `install` hung
        # instead. `Acquire::http::Timeout` does not help either: it bounds INACTIVITY,
        # and a transfer dribbling at 32 kB/s is never inactive.
        #
        # Nothing here is weakened. If the image ever stops shipping Clang the fallback
        # installs it exactly as before; a package that genuinely cannot be installed
        # still fails the step, and every gate below is untouched.
