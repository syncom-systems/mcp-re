# SPDX-License-Identifier: Apache-2.0
#
# ADR-MCPRE-059 verification platform — AUTHORITATIVE, GitHub-hosted.
#
# This workflow GATES. It runs on standard GitHub-hosted Linux with a read-only token and no
# secrets, so a pull request from anyone executes here and never on a privileged host.
#
#   scope       ubuntu-24.04      `select-units`: what this change affects, or every unit
#   host        ubuntu-24.04      `verify --phase host`: tests, mutations, structural probes,
#                                  the measured lane and the Verus lane, against the pinned
#                                  Linux x86-64 prover
#   extraction  ubuntu-24.04-arm  `verify --phase extraction`: Charon, Aeneas and Lean inside
#                                  the pinned linux/arm64 extraction image, loaded from its
#                                  digest-verified preserved archive
#   negative    ubuntu-24.04      hostile edits that the production lanes must refuse
#   aggregate   ubuntu-24.04      `verify --aggregate --gate` over every record above
#   assurance-closure             a complete run only: `assurance-closure` attests the
#               ubuntu-24.04      aggregate's evidence into a fresh store and decides whether
#                                  every theorem is review-current, established and currently
#                                  verified and every system root complete. It runs no lane.
#
# This workflow runs only on the weekly schedule and on dispatch, and every run is a COMPLETE
# run: every unit is measured and nothing is scoped. A lane that could not run leaves a missing
# record, which the aggregate reports as INCOMPLETE: nothing here turns an absent measurement
# into success. Between complete runs, the bounded `mutation-probe.yml` self-test covers the
# units a pull request moves, and defers to this run whenever it cannot bound its scope.
#
# Measured on these runners (docs/dev/hosted-runner-findings.md): the complete host phase
# takes 66 to 83 minutes and peaks near 4.5 GB of memory and 32 GB of added disk; the
# extraction phase takes about 5 minutes including the archive load.

name: verification

# THE COMPLETE RUN ONLY. Nothing an ordinary pull request or push to main does starts this
# workflow: no `pull_request`, no `push`, no `paths:` filter. A change to MODULE.bazel, the
# toolchain, the lockfiles, `verification/` or `tools/verification/` invalidates evidence
# (every unit fingerprint moves; `verify --gate` and `review` report the evidence stale or
# missing) without authorizing a remeasurement. The remeasurement is a decision: the weekly
# schedule, or a dispatch. `scripts/verification_trigger_gate.py` holds the trigger set to exactly
# those two, and proves it with negative controls.
on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: complete run (schedule or dispatch only)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      measure: ${{ steps.scope.outputs.measure }}
      complete: ${{ steps.scope.outputs.complete }}
    steps:
      # Defence in depth behind the trigger set: a trigger added by mistake produces a failed
      # run here, not a measurement. `scripts/verification_trigger_gate.py` is the control that
      # keeps the trigger set from changing; this step is what a missed change meets.
      - name: Refuse any event that did not ask for a complete run
        id: scope
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch)
              echo "complete run: a ${{ github.event_name }} event measures every unit"
              { echo "measure=true"; echo "complete=true"; } >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::verification.yml is the complete run; a ${{ github.event_name }} event never starts it"
              exit 1 ;;
          esac

  host:
    name: host lanes (ubuntu-24.04 x86-64)
    needs: scope
    if: needs.scope.outputs.measure == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up the pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Runner shape
        run: |
          uname -a; nproc; free -m; df -h /
          echo "image: ${ImageOS:-?} ${ImageVersion:-?}"

      - name: A fresh evidence directory for this run
        id: evidence
        run: |
          set -euo pipefail
          rel=".verification/run-${{ github.run_id }}-${{ github.run_attempt }}-host"
          mkdir -p "$PWD/$rel"
          echo "dir=$PWD/$rel" >> "$GITHUB_OUTPUT"
          echo "MCP_RE_EVIDENCE_DIR=$PWD/$rel" >> "$GITHUB_ENV"

      - name: Install the pinned Verus release, digest-checked
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/verification && sudo chown "$USER" /opt/verification
          python3 scripts/install_pinned_verus.py
          cat /opt/verification/verus/*/version.json

      - name: Install uv at a pinned version
        run: pipx install uv==0.12.3 && uv --version

      - name: Runner environment preflight
        run: ./scripts/verification_runner_preflight.sh

      - name: Prepare the non-Rust SDK batteries
        run: |
          set -euo pipefail
          measures() { grep -q "^id = \"$1\." verification/policy/verification.toml; }
          if measures sdk_python; then ./scripts/prepare_python_matrix.sh; fi
          if measures sdk_typescript; then ./scripts/prepare_node_matrix.sh; fi

      - name: Structural and measured lane self-tests
        run: |
          python3 tools/verification/test_structural_lane.py
          python3 tools/verification/test_measured_lane.py

      - name: Execute the host lanes (measured)
        run: |
          set -uo pipefail
          ( while sleep 30; do
              printf 'disk_used_mb=%s mem_used_mb=%s\n' \
                "$(df -m / | awk 'NR==2{print $3}')" "$(free -m | awk 'NR==2{print $3}')"
            done ) > "$RUNNER_TEMP/samples.log" &
          start=$(date +%s)
          ./tools/verification/verify --phase host
          status=$?
          echo "host phase exit $status after $(( $(date +%s) - start )) s"
          sed -E 's/.*disk_used_mb=([0-9]+).*/\1/' "$RUNNER_TEMP/samples.log" | sort -n | tail -1 | sed 's/^/peak disk_used_mb=/'
          sed -E 's/.*mem_used_mb=([0-9]+)/\1/' "$RUNNER_TEMP/samples.log" | sort -n | tail -1 | sed 's/^/peak mem_used_mb=/'
          exit $status

      - name: The records this job produced
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.dir }}
          if-no-files-found: warn
          retention-days: 14

  extraction:
    name: extraction lanes (ubuntu-24.04-arm)
    needs: scope
    if: needs.scope.outputs.measure == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up the pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Runner shape
        run: |
          uname -a; nproc; free -m; df -h /

      - name: A fresh evidence directory for this run
        id: evidence
        run: |
          set -euo pipefail
          rel=".verification/run-${{ github.run_id }}-${{ github.run_attempt }}-extraction"
          mkdir -p "$PWD/$rel"
          echo "dir=$PWD/$rel" >> "$GITHUB_OUTPUT"
          echo "rel=$rel" >> "$GITHUB_OUTPUT"

      - name: Containerd image store, so an image id is the manifest digest the lock records
        run: |
          set -euo pipefail
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Fetch the preserved extraction archive and load it
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r digest archive tag < <(python3 -c "
          import tomllib
          d = tomllib.load(open('verification/policy/toolchains.lock.toml','rb'))['extraction_container']
          assert d['state'] == 'resolved' and d['platform'] == 'linux/arm64'
          print(d['artifact_digest'], d['archive_digest'].split(':')[1], 'extraction-archive-' + d['artifact_digest'].split(':')[1][:8])")
          start=$(date +%s)
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/arch" -p 'archive.part-*'
          cat "$RUNNER_TEMP"/arch/archive.part-* > "$RUNNER_TEMP/archive.tar"
          rm -rf "$RUNNER_TEMP/arch"
          echo "${archive}  $RUNNER_TEMP/archive.tar" | sha256sum -c -
          echo "fetch_seconds=$(( $(date +%s) - start ))"
          docker load -i "$RUNNER_TEMP/archive.tar"
          rm -f "$RUNNER_TEMP/archive.tar"
          echo "fetch_and_load_seconds=$(( $(date +%s) - start ))"
          id=$(docker image inspect "$digest" --format '{{.Id}}')
          test "$id" = "$digest"
          echo "image=$id" >> "$GITHUB_OUTPUT"
          df -m / | awk 'NR==2{print "disk_used_after_load_mb=" $3}'

      - name: Regenerate the extracted model
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 -m 12g --memory-swap 14g \
            -v "$PWD:/workspace" -w /workspace \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/workspace \
            -e MCP_RE_EVIDENCE_DIR='/workspace/${{ steps.evidence.outputs.rel }}' \
            '${{ steps.image.outputs.image }}' ./tools/verification/regenerate-lean

      - name: Lean lane activation probe
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 -m 12g --memory-swap 14g \
            -v "$PWD:/workspace" -w /workspace \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/workspace \
            '${{ steps.image.outputs.image }}' ./tools/verification/verify-lean --activation-probe

      - name: Execute the extraction lanes (measured)
        run: |
          set -uo pipefail
          ( while sleep 30; do
              printf 'disk_used_mb=%s mem_used_mb=%s\n' \
                "$(df -m / | awk 'NR==2{print $3}')" "$(free -m | awk 'NR==2{print $3}')"
            done ) > "$RUNNER_TEMP/samples.log" &
          start=$(date +%s)
          docker run --rm --platform linux/arm64 -m 12g --memory-swap 14g \
            -v "$PWD:/workspace" -w /workspace \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/workspace \
            -e MCP_RE_EVIDENCE_DIR='/workspace/${{ steps.evidence.outputs.rel }}' \
            '${{ steps.image.outputs.image }}' ./tools/verification/verify --phase extraction
          status=$?
          echo "extraction phase exit $status after $(( $(date +%s) - start )) s"
          sed -E 's/.*disk_used_mb=([0-9]+).*/\1/' "$RUNNER_TEMP/samples.log" | sort -n | tail -1 | sed 's/^/peak disk_used_mb=/'
          sed -E 's/.*mem_used_mb=([0-9]+)/\1/' "$RUNNER_TEMP/samples.log" | sort -n | tail -1 | sed 's/^/peak mem_used_mb=/'
          exit $status

      - name: The records this job produced
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-extraction-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.dir }}
          if-no-files-found: warn
          retention-days: 14

  negative-controls:
    name: negative controls (ubuntu-24.04 x86-64)
    needs: scope
    if: needs.scope.outputs.measure == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up the pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install the pinned Verus release, digest-checked
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/verification && sudo chown "$USER" /opt/verification
          python3 scripts/install_pinned_verus.py
      - name: Refusals propagate from the production lanes
        run: python3 scripts/hosted_negative_controls.py

  aggregate:
    name: compose the repository verdict
    needs: [scope, host, extraction, negative-controls]
    if: ${{ !cancelled() && needs.scope.outputs.measure == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up the pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/download-artifact@v8
        with:
          pattern: evidence-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/records
          merge-multiple: true
      - name: Compose the verdict from both records sets
        run: |
          set -euo pipefail
          mkdir -p .verification/composed
          cp -R "$RUNNER_TEMP"/records/. .verification/composed/
          export MCP_RE_EVIDENCE_DIR="$PWD/.verification/composed"
          ls "$MCP_RE_EVIDENCE_DIR" | head -50
          ./tools/verification/verify --aggregate --gate

      - name: The records the verdict was composed from
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .verification/composed
          if-no-files-found: warn
          retention-days: 14

  # A complete run's continuation: the evidence `aggregate` composed becomes attestations,
  # and the theorems are evaluated over them. No lane runs here; everything this job reads
  # was measured above, bound to the fingerprints it was measured at.
  assurance-closure:
    name: establish assurance closure
    needs: [scope, aggregate]
    if: ${{ !cancelled() && needs.aggregate.result == 'success' && needs.scope.outputs.complete == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up the pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/download-artifact@v8
        with:
          name: verification-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
      - name: Attest this run's evidence and decide assurance closure
        run: |
          ./tools/verification/assurance-closure --evidence "$RUNNER_TEMP/evidence" \
            --event "${{ github.event_name }}" --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" --out "$RUNNER_TEMP/closure"
      - name: The attestations, theorem review and closure verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assurance-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/closure
          if-no-files-found: warn
          retention-days: 14
