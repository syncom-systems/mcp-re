      # ADR-MCPRE-063 Slice 1: the certificate identity authority and the peer-identity
      # value invariant it constructs. The whole module tree, not the interpreter alone —
      # the selector's claim rests on the representation seam preserving presented order
      # and on the adapter producing that representation, so a change to either dirties
      # the units.
      - "mcp-re-proxy/src/communication_assurance/**"
      # ADR-MCPRE-068 Phase 0D-8: the crate root is a PROBE input, not a fingerprint one.
      # S12 and S13 attack the `communication_assurance` authority boundary from OUTSIDE it,
      # so their insertion parent is `lib.rs` — the lane edits that file in its scratch copy
      # to declare the injected module. A change to it can therefore change what the probes
      # compile against, and the lane must re-run. This is the one filter here that exists
      # for a probe's site rather than for a unit's sources.
      - "mcp-re-proxy/src/lib.rs"
      # The merged plain-library integration binary carries this unit's DER-level
      # controls, and encoding v4 digests those sources, not only their names — the
      # sources the build graph lists for the target.
      - "mcp-re-proxy/tests/integration/**"
      # v0.17: the bounded-drain battery, `proxy.serving_drain`. Its own binary, because it
      # runs under RUST_TEST_THREADS=1 in the Bazel lane — a property of a binary.
      - "mcp-re-proxy/tests/async_drain_test.rs"
      - "mcp-re-proxy/tests/async_drain_test/**"
      # MCPRE-146/148: the three trust units declared with the four theorems — the
      # revocation posture and trust-document state, the plan projected from them, and
      # the composition root that consumes those projections without re-reading trust.
      - "mcp-re-proxy/src/config_state/trust_revocation.rs"
      - "mcp-re-proxy/src/config_state/trust_document.rs"
      # v0.17 / #581 row 2: the connection credential window, `proxy.client_credential_window`.
      - "mcp-re-proxy/src/config_state/client_credential_window.rs"
      # The ADR-MCPRE-068 structural probe S04 injects a sibling module here and
      # requires the parent not to declare it already. A change to this file can
      # make that probe stale, or move the boundary it attacks, so it re-triggers
      # the lane — `verification_trigger_gate.py` derives the requirement from the
      # probe registry rather than trusting this list.
      - "mcp-re-proxy/src/config_state/mod.rs"
      - "mcp-re-proxy/src/config_state/credential_currency_bound.rs"
      # ADR-MCPRE-069 NP-049…NP-060: the layer-A configuration classifiers, each a unit
      # under THM-0077 with a registered `mutation://` falsifier. Their source is a
      # ReviewFingerprint component and the probes read it, so a change here must re-measure.
      - "mcp-re-proxy/src/config_state/replay.rs"
      - "mcp-re-proxy/src/config_state/delegated_signing.rs"
      - "mcp-re-proxy/src/config_state/transport.rs"
      - "mcp-re-proxy/src/config_state/channel_credential_custody.rs"
      - "mcp-re-proxy/src/config_state/channel_key_material.rs"
      - "mcp-re-proxy/src/config_state/freshness.rs"
      - "mcp-re-proxy/src/config_state/coordinate.rs"
      - "mcp-re-proxy/src/config_snapshot.rs"
      - "mcp-re-proxy/src/shared_replay.rs"
      - "mcp-re-proxy/src/config_state/server_identity.rs"
      - "mcp-re-proxy/src/config_state/validation/machine_violations.rs"
      - "mcp-re-proxy/src/config_state/validation/recognition.rs"
      # SL-POSTURE-2: the last four unowned classifiers, and the startup planner, which was
      # in no unit's `paths` at all until its three propositions got units.
      - "mcp-re-proxy/src/config_state/evidence.rs"
      - "mcp-re-proxy/src/config_state/in_flight_limit.rs"
      - "mcp-re-proxy/src/config_state/connection_bounds/mod.rs"
      - "mcp-re-proxy/src/config_state/connection_bounds/refusal.rs"
      - "mcp-re-proxy/src/inner_plane_bound.rs"
      - "mcp-re-proxy/src/config_state/mcp_transport_contract.rs"
      - "mcp-re-proxy/src/config_state/topology.rs"
      - "mcp-re-proxy/src/startup_plan.rs"
      # ADR-MCPRE-067 Phase 5 moved the online-revocation SELECTION out of a flat
      # `DeploymentRequest` field, so `proxy.online_ocsp_reachability`'s closure now names
      # the file holding `is_required()` — the predicate THM-0013's refusal reads.
      - "mcp-re-proxy/src/deployment_request/revocation/**"
      - "mcp-re-proxy/src/trust_plan.rs"
      - "mcp-re-proxy/src/app.rs"
      # ADR-MCPRE-065 Slice 2 (THM-0040): the PDP-decision relation authority, and the
      # three semantic products it compares against — the authorization request and the
      # verified actor and action it is composed from. All four participate in the
      # fingerprint, so all four must re-run the lane.
      - "mcp-re-proxy/src/authorization/pdp/**"
      - "mcp-re-proxy/src/authorization/request.rs"
      - "mcp-re-proxy/src/authorization/verified_actor.rs"
      - "mcp-re-proxy/src/authorization/verified_action.rs"
      # THM-0040 is measured through the serving path, so its battery lives in the async
      # integration target. Same shape as the `integration` directory above.
      - "mcp-re-proxy/tests/integration_async/**"
      # ADR-MCPRE-069 NP-158. `proxy.aws_web_identity_credential_exchange`'s battery is this
      # target, and the target is `#![cfg(feature = "aws_kms_keysource")]` — so without the
      # feature it compiles to zero tests and exits 0. The unit's selector names the target
      # built with the feature; what this pair supplies is the re-run, because the file's
      # BYTES are a fingerprint component and a change to them that did not re-measure would
      # leave an attestation standing over a battery that had moved.
      - "mcp-re-proxy/tests/aws_irsa_web_identity_test/**"
      - "mcp-re-proxy/tests/aws_irsa_web_identity_test.rs"
      # The build inputs every Rust ReviewFingerprint reads. A dependency bump moves
      # bazel/crates.lock, which dirties every declared Rust unit — so a lane that did
      # not re-run on it would leave `main` carrying attestations over a dependency
      # graph nothing measured. `scripts/verification_trigger_gate.py` fails the
      # build if this set ever narrows below the fingerprint's again.
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "bazel/**"
      - ".bazelrc"
      - ".bazelversion"
      # Each package's BUILD file decides its targets' sources, roots and features.
      - "**/BUILD.bazel"
      # Integration-target sources the build graph lists beside the target's own file.
      - "mcp-re-proxy/tests/common/**"
      - "mcp-re-proxy/tests/serving_fixtures/**"
      - "mcp-re-proxy/tests/startup_transcript/**"
      - "mcp-re-core/Cargo.toml"
      - "mcp-re-http-profile/Cargo.toml"
      - "mcp-re-proxy/Cargo.toml"
  # THE COMPLETE RUN: every unit, every lane. Weekly, and by dispatch for a release
  # (release-assurance composes a dispatched run on the release commit).
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: select the units this change affects
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      measure: ${{ steps.scope.outputs.measure }}
      args: ${{ steps.scope.outputs.args }}
    steps:
      # Depth 2: a pull request checks out its MERGE commit, and `select-units` measures the
      # change against that commit's first parent, the base it merges into.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Select the units this change affects
        id: scope
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch)
              echo "complete run: a ${{ github.event_name }} event measures every unit"
              { echo "args="; echo "measure=true"; } >> "$GITHUB_OUTPUT"
              exit 0 ;;
            push)
              base='${{ github.event.before }}' ;;
            *)
              if git rev-parse -q --verify HEAD^2 >/dev/null; then
                base=HEAD^1
              else
                base='${{ github.event.pull_request.base.sha }}'
              fi ;;
          esac
          case "$base" in HEAD^1) ;; *) git fetch -q --no-tags --depth=1 origin "$base" || true ;; esac
          mkdir -p .verification/scope
          python3 tools/verification/select-units --base "$base" \
            --out .verification/scope/units --github-output | tee .verification/scope/why
          mode=$(sed -n 's/^mode=//p' "$GITHUB_OUTPUT" | tail -1)
          count=$(sed -n 's/^count=//p' "$GITHUB_OUTPUT" | tail -1)
          if [ "$mode" = "scoped" ] && [ "$count" = "0" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "measure=false" >> "$GITHUB_OUTPUT"
            head -1 .verification/scope/why
            echo "No unit is affected by this change; nothing is measured."
          elif [ "$mode" = "scoped" ]; then
            echo "args=--units-file .verification/scope/units" >> "$GITHUB_OUTPUT"
            echo "measure=true" >> "$GITHUB_OUTPUT"
          else
            # A change to the platform itself, a scope over its cap, or one that cannot be
            # computed is measured in full. Hosted minutes are free for this repository, so
            # an expensive check is run before merge instead of being deferred to the weekly run.
            head -1 .verification/scope/why
            echo "mode is $mode: measuring every unit before merge"
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "measure=true" >> "$GITHUB_OUTPUT"
          fi
      - name: The scope this run measures
        if: steps.scope.outputs.measure == 'true' && steps.scope.outputs.args != ''
        uses: actions/upload-artifact@v7
        with:
          name: scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: .verification/scope
          retention-days: 14

  host:
    name: host lanes (ubuntu-24.04 x86-64)
    needs: scope
    if: needs.scope.outputs.measure == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.args != ''
        with:
          name: scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: .verification/scope

      - name: Runner shape
        run: |
          uname -a; nproc; free -m; df -h /
          echo "image: ${ImageOS:-?} ${ImageVersion:-?}"

      - name: A fresh evidence directory for this run
        id: evidence
        run: |
          set -euo pipefail
          rel=".verification/run-${{ github.run_id }}-${{ github.run_attempt }}-host"
          mkdir -p "$PWD/$rel"
          echo "dir=$PWD/$rel" >> "$GITHUB_OUTPUT"
          echo "MCP_RE_EVIDENCE_DIR=$PWD/$rel" >> "$GITHUB_ENV"

      - name: Install the pinned Verus release, digest-checked
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/verification && sudo chown "$USER" /opt/verification
          python3 scripts/install_pinned_verus.py
          cat /opt/verification/verus/*/version.json

      - name: Install uv at a pinned version
        run: pipx install uv==0.12.3 && uv --version

      - name: Runner environment preflight
        run: ./scripts/verification_runner_preflight.sh

      - name: Prepare the non-Rust SDK batteries
        env:
          UNITS_ARGS: ${{ needs.scope.outputs.args }}
        run: |
          set -euo pipefail
          measures() {
            if [ -z "${UNITS_ARGS}" ]; then
              grep -q "^id = \"$1\." verification/policy/verification.toml
            else
              grep -q "^$1\." .verification/scope/units
            fi
          }
          if measures sdk_python; then ./scripts/prepare_python_matrix.sh; fi
          if measures sdk_typescript; then ./scripts/prepare_node_matrix.sh; fi

      - name: Structural and measured lane self-tests
        run: |
          python3 tools/verification/test_structural_lane.py
          python3 tools/verification/test_measured_lane.py

      - name: Execute the host lanes (measured)
        run: |
          set -uo pipefail
          ( while sleep 30; do
              printf 'disk_used_mb=%s mem_used_mb=%s\n' \
                "$(df -m / | awk 'NR==2{print $3}')" "$(free -m | awk 'NR==2{print $3}')"
            done ) > "$RUNNER_TEMP/samples.log" &
          start=$(date +%s)
          ./tools/verification/verify --phase host ${{ needs.scope.outputs.args }}
          status=$?
          echo "host phase exit $status after $(( $(date +%s) - start )) s"
          sed -E 's/.*disk_used_mb=([0-9]+).*/\1/' "$RUNNER_TEMP/samples.log" | sort -n | tail -1 | sed 's/^/peak disk_used_mb=/'
          sed -E 's/.*mem_used_mb=([0-9]+)/\1/' "$RUNNER_TEMP/samples.log" | sort -n | tail -1 | sed 's/^/peak mem_used_mb=/'
          exit $status

      - name: The records this job produced
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.dir }}
          if-no-files-found: warn
          retention-days: 14

  extraction:
    name: extraction lanes (ubuntu-24.04-arm)
    needs: scope
    if: needs.scope.outputs.measure == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.args != ''
        with:
          name: scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: .verification/scope

      - name: Runner shape
        run: |
          uname -a; nproc; free -m; df -h /

      - name: A fresh evidence directory for this run
        id: evidence
        run: |
          set -euo pipefail
          rel=".verification/run-${{ github.run_id }}-${{ github.run_attempt }}-extraction"
          mkdir -p "$PWD/$rel"
          echo "dir=$PWD/$rel" >> "$GITHUB_OUTPUT"
          echo "rel=$rel" >> "$GITHUB_OUTPUT"

      - name: Containerd image store, so an image id is the manifest digest the lock records
        run: |
          set -euo pipefail
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Fetch the preserved extraction archive and load it
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r digest archive tag < <(python3 -c "
          import tomllib
          d = tomllib.load(open('verification/policy/toolchains.lock.toml','rb'))['extraction_container']
          assert d['state'] == 'resolved' and d['platform'] == 'linux/arm64'
          print(d['artifact_digest'], d['archive_digest'].split(':')[1], 'extraction-archive-' + d['artifact_digest'].split(':')[1][:8])")
          start=$(date +%s)
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/arch" -p 'archive.part-*'
          cat "$RUNNER_TEMP"/arch/archive.part-* > "$RUNNER_TEMP/archive.tar"
          rm -rf "$RUNNER_TEMP/arch"
          echo "${archive}  $RUNNER_TEMP/archive.tar" | sha256sum -c -
          echo "fetch_seconds=$(( $(date +%s) - start ))"
          docker load -i "$RUNNER_TEMP/archive.tar"
          rm -f "$RUNNER_TEMP/archive.tar"
          echo "fetch_and_load_seconds=$(( $(date +%s) - start ))"
          id=$(docker image inspect "$digest" --format '{{.Id}}')
          test "$id" = "$digest"
          echo "image=$id" >> "$GITHUB_OUTPUT"
          df -m / | awk 'NR==2{print "disk_used_after_load_mb=" $3}'

      - name: Regenerate the extracted model
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 -m 12g --memory-swap 14g \
            -v "$PWD:/workspace" -w /workspace \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/workspace \
            -e MCP_RE_EVIDENCE_DIR='/workspace/${{ steps.evidence.outputs.rel }}' \
            '${{ steps.image.outputs.image }}' ./tools/verification/regenerate-lean

      - name: Lean lane activation probe
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 -m 12g --memory-swap 14g \
            -v "$PWD:/workspace" -w /workspace \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/workspace \
            '${{ steps.image.outputs.image }}' ./tools/verification/verify-lean --activation-probe

      - name: Execute the extraction lanes (measured)
        run: |
          set -uo pipefail
          ( while sleep 30; do
              printf 'disk_used_mb=%s mem_used_mb=%s\n' \
                "$(df -m / | awk 'NR==2{print $3}')" "$(free -m | awk 'NR==2{print $3}')"
            done ) > "$RUNNER_TEMP/samples.log" &
          start=$(date +%s)
          docker run --rm --platform linux/arm64 -m 12g --memory-swap 14g \
            -v "$PWD:/workspace" -w /workspace \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/workspace \
            -e MCP_RE_EVIDENCE_DIR='/workspace/${{ steps.evidence.outputs.rel }}' \
            '${{ steps.image.outputs.image }}' ./tools/verification/verify --phase extraction ${{ needs.scope.outputs.args }}
          status=$?
          echo "extraction phase exit $status after $(( $(date +%s) - start )) s"
          sed -E 's/.*disk_used_mb=([0-9]+).*/\1/' "$RUNNER_TEMP/samples.log" | sort -n | tail -1 | sed 's/^/peak disk_used_mb=/'
          sed -E 's/.*mem_used_mb=([0-9]+)/\1/' "$RUNNER_TEMP/samples.log" | sort -n | tail -1 | sed 's/^/peak mem_used_mb=/'
          exit $status

      - name: The records this job produced
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-extraction-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.dir }}
          if-no-files-found: warn
          retention-days: 14

  negative-controls:
    name: negative controls (ubuntu-24.04 x86-64)
    needs: scope
    if: needs.scope.outputs.measure == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Install the pinned Verus release, digest-checked
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/verification && sudo chown "$USER" /opt/verification
          python3 scripts/install_pinned_verus.py
      - name: Refusals propagate from the production lanes
        run: python3 scripts/hosted_negative_controls.py

  aggregate:
    name: compose the repository verdict
    needs: [scope, host, extraction, negative-controls]
    if: ${{ !cancelled() && needs.scope.outputs.measure == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.args != ''
        with:
          name: scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: .verification/scope
      - uses: actions/download-artifact@v8
        with:
          pattern: evidence-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/records
          merge-multiple: true
      - name: Compose the verdict from both records sets
        run: |
          set -euo pipefail
          mkdir -p .verification/composed
          cp -R "$RUNNER_TEMP"/records/. .verification/composed/
          export MCP_RE_EVIDENCE_DIR="$PWD/.verification/composed"
          ls "$MCP_RE_EVIDENCE_DIR" | head -50
          ./tools/verification/verify --aggregate --gate ${{ needs.scope.outputs.args }}

      - name: The records the verdict was composed from
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .verification/composed
          if-no-files-found: warn
          retention-days: 14
