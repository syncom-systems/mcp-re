name: hosted-probe-image

# Distribution benchmark for the preserved extraction image on ubuntu-24.04-arm:
#   A. download the digest-checked preserved archive from its release and load it;
#   B. publish the loaded image to GHCR (repository-scoped GITHUB_TOKEN);
#   C. pull it back by immutable digest on a fresh runner.
# Read-only for contents; the only write is the GHCR package this workflow owns.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/hosted-probe-image.yml"

permissions:
  contents: read

env:
  ARCHIVE_TAG: extraction-archive-ce0df16f
  ARCHIVE_SHA256: "469f57765b0a0786e2bc11d0349103c9c0bfd18a583cbe158e1a785842cb4605"
  ARTIFACT_DIGEST: "sha256:ce0df16f21fb96766708409e80f6c788bd3d42c32a0912576924512a4b7b3c02"
  REPO_IMAGE: ghcr.io/syncom-systems/mcp-re-verification-extraction

jobs:
  archive-load-and-publish:
    name: A+B archive load, GHCR publish
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Containerd image store, so the image id is the manifest digest the lock records
        run: |
          set -euo pipefail
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.DriverStatus}}'
          df -m / | awk 'NR==2{print "disk_used_before_mb=" $3}'
      - name: A1 download the archive parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          gh release download "$ARCHIVE_TAG" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/arch" -p 'archive.part-*'
          cat "$RUNNER_TEMP"/arch/archive.part-* > "$RUNNER_TEMP/archive.tar"
          rm -rf "$RUNNER_TEMP/arch"
          echo "download_seconds=$(( $(date +%s) - start ))"
          echo "${ARCHIVE_SHA256}  $RUNNER_TEMP/archive.tar" | sha256sum -c -
          df -m / | awk 'NR==2{print "disk_used_after_download_mb=" $3}'
      - name: A2 load and check the image identity
        run: |
          set -euo pipefail
          start=$(date +%s)
          docker load -i "$RUNNER_TEMP/archive.tar"
          echo "load_seconds=$(( $(date +%s) - start ))"
          id=$(docker image inspect "$ARTIFACT_DIGEST" --format '{{.Id}}')
          echo "image id: $id"
          test "$id" = "$ARTIFACT_DIGEST"
          docker system df
          df -m / | awk 'NR==2{print "disk_used_after_load_mb=" $3}'
      - name: B publish to GHCR
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$ARTIFACT_DIGEST" "$REPO_IMAGE:tc-ac2daa3af3dcc7c4"
          start=$(date +%s)
          docker push "$REPO_IMAGE:tc-ac2daa3af3dcc7c4" | tee "$RUNNER_TEMP/push.log"
          echo "push_seconds=$(( $(date +%s) - start ))"
          grep -o 'digest: sha256:[0-9a-f]*' "$RUNNER_TEMP/push.log"

  pull-by-digest:
    name: C pull by immutable digest
    needs: archive-load-and-publish
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Containerd image store
        run: |
          set -euo pipefail
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          df -m / | awk 'NR==2{print "disk_used_before_mb=" $3}'
      - name: Pull by digest (repository token; the package is private until its visibility is changed)
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          start=$(date +%s)
          docker pull "$REPO_IMAGE@$ARTIFACT_DIGEST"
          echo "pull_seconds=$(( $(date +%s) - start ))"
          id=$(docker image inspect "$REPO_IMAGE@$ARTIFACT_DIGEST" --format '{{.Id}}')
          echo "image id: $id"
          test "$id" = "$ARTIFACT_DIGEST"
          df -m / | awk 'NR==2{print "disk_used_after_pull_mb=" $3}'
