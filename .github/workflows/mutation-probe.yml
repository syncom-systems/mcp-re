# SPDX-License-Identifier: Apache-2.0
#
# The V0 evidence self-test — ADR-MCPRE-059,
# `verification/policy/mutation-probes.toml`.
#
# A class-V0 theorem rests on a test battery, and "the battery passed" is not evidence
# that any production check is LOAD-BEARING. This lane deliberately weakens each check a
# theorem names and requires a DECLARED negative control to go red. It is the same
# argument as `clippy_ratchet_gate.py --activation-probe`: a gate claiming a rule is
# enforced is much stronger when breaking the rule provably turns it red.
#
# It is a SELF-TEST of one unit's evidence, not a merge gate on unrelated work, so it is
# filtered to the things that can invalidate it:
#
#   * the implementation the probes weaken;
#   * the test evidence whose controls must go red;
#   * the probe definitions and the lane itself;
#   * the manifest that says which controls the unit declares.
#
# A probe whose anchor no longer matches exactly one site fails as STALE. That is a demand
# to RE-ADJUDICATE the probe against the new implementation — never to restore the old
# code. Refactoring `verify.rs` is expected; losing a claimed conjunct's control silently
# is not.
#
# `tools/verification/verify` ALSO runs this lane, and the duplication is deliberate. There
# it is one step of the complete run whose records `attest` consumes; here it is a bounded,
# narrowly-filtered signal on the pull requests that can actually invalidate it. Neither makes
# the other redundant: this job writes no attestation.
#
# BOUNDED: a pull request applies only the probes of the units it moves, at most 20 units,
# inside a 30 minute timeout. A platform change, a larger scope, or a scope that cannot be
# computed applies NO probe here and is deferred to the complete run (weekly, or dispatch).
# `scripts/verification_trigger_gate.py` enforces the triggers, the cap and the timeout.
#
# SHARDED: a probe costs about 28 s after its target's first build, which costs about 230 s,
# so one job applies at most 20 units' probes only when they are few. The selected units are
# packed, in id order so a shard's units share their crate's build, into shards of at most 25
# probes, each its own job under the same 30 minute bound. The weekly complete run is sharded
# the same way, which is the only way its 568 probes fit the bound at all. The SDK units'
# probes are the exception to the packing: each SDK is a shard of its own that prepares its
# matrix first (the Python wheel environment, or the pinned Node runtimes), beside the Rust
# shards rather than in front of them. The check the
# merge-readiness gate reads is `verdict`, which composes every shard's verdict line and is
# green only when each of the shards the scope decided on reported PASS.

name: mutation probe

on:
  pull_request:
    paths:
      - "verification/policy/mutation-probes.toml"
      - "verification/policy/verification.toml"
      - "tools/verification/verify-mutations"
      - "tools/verification/test_mutation_lane.py"
      - "tools/verification/_mutation_lane_*.py"
      - "tools/verification/_manifest.py"
      - "tools/verification/_record_rules.py"
      - "tools/verification/_assumptions.py"
      - "tools/verification/_assumption_sites.py"
      - "tools/verification/_assumption_scope.py"
      - "tools/verification/_trust_boundaries.py"
      - "tools/verification/_boundary_crossings.py"
      - "tools/verification/_toolchain_lock.py"
      - "tools/verification/_verdict.py"
      - "tools/verification/_unit_rules.py"
      - "tools/verification/_edges.py"
      - ".github/workflows/mutation-probe.yml"
      - "docs/architecture/components/evidence-verification.md"
      - "mcp-re-http-profile/src/**"
      - "mcp-re-http-profile/tests/**"
      - "mcp-re-core/src/**"
      - "mcp-re-proxy/src/tls_listener_state/**"
      - "mcp-re-proxy/src/tls/**"
      # MCPRE-175 split this into an owner subtree (`client_revocation_posture.rs`,
      # `crl_reload_worker.rs`). A SUBTREE pattern rather than today's children: the
      # authority is the plane, and a filter enumerating its current members would go
      # stale the next time one is added — silently, because a filter that matches
      # nothing fails nothing.
      - "mcp-re-proxy/src/tls_plane/**"
      - "mcp-re-proxy/src/delegated_tls.rs"

  # THE COMPLETE RUN: every probe. Weekly, and by dispatch. Never a push to main: what runs
  # after a merge is `post-merge.yml`.
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: mutation-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides, in seconds, whether this change has probes to apply. It is a job of its own so that
  # a deferral is visible as a SKIPPED `probe` check rather than as a green one: a probe job
  # that succeeded having applied nothing would read, to the merge-readiness gate, as a
  # measured lane.
  scope:
    name: mutation probe scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      measure: ${{ steps.scope.outputs.measure }}
      shards: ${{ steps.scope.outputs.shards }}
      shard-count: ${{ steps.scope.outputs.shard-count }}
    steps:
      # Depth 2: a pull request checks out its MERGE commit, and `select-units` measures the
      # change against that commit's first parent.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up the pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # A MERGE CHECK APPLIES ONLY THE PROBES OF THE UNITS ITS CHANGE AFFECTS, never all.
      # Same selection as `verification.yml`: moved fingerprints plus their prerequisite
      # consumers, narrowed to the units that owe the mutation lane evidence. A platform
      # change, a scope over the cap, or a scope that cannot be computed is deferred to the
      # complete run: the weekly schedule and manual dispatch.
      - name: Select the units this change affects
        id: scope
        run: |
          set -euo pipefail
          units="$RUNNER_TEMP/mutation-units"
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch)
              echo "complete run: a ${{ github.event_name }} event applies every probe" > "$RUNNER_TEMP/why"
              python3 -c 'import tomllib; print("\n".join(sorted({p["unit"] for p in tomllib.load(open("verification/policy/mutation-probes.toml", "rb"))["probe"]})))' > "$units"
              { echo "mode=complete"; echo "count=$(wc -l < "$units")"; } >> "$GITHUB_OUTPUT" ;;
            *)
              if git rev-parse -q --verify HEAD^2 >/dev/null; then
                base=HEAD^1
              else
                base='${{ github.event.pull_request.base.sha }}'
              fi
              case "$base" in HEAD^1) ;; *) git fetch -q --no-tags --depth=1 origin "$base" || true ;; esac
              # A scope that cannot be computed is DEFERRED to the complete run, never widened to it.
              if ! python3 tools/verification/select-units --base "$base" --out "$units" \
                  --lane mutation --max-units 20 --github-output > "$RUNNER_TEMP/why"; then
                echo "select-units: deferred - the scope could not be computed; verified by the weekly run instead" > "$RUNNER_TEMP/why"
                : > "$units"
                { echo "mode=deferred"; echo "count=0"; } >> "$GITHUB_OUTPUT"
              fi ;;
          esac
          cat "$RUNNER_TEMP/why"
          mode=$(sed -n 's/^mode=//p' "$GITHUB_OUTPUT" | tail -1)
          count=$(sed -n 's/^count=//p' "$GITHUB_OUTPUT" | tail -1)
          if { [ "$mode" = "scoped" ] || [ "$mode" = "complete" ]; } && [ "$count" != "0" ]; then
            echo "measure=true" >> "$GITHUB_OUTPUT"
          else
            { echo "measure=false"; echo "shards=[]"; echo "shard-count=0"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The shards: the selected units in id order, so the units of one crate share a shard
          # and its build, packed into shards of at most 25 probes. The SDK units are the
          # exception: each SDK's probes form a shard of their own, marked with the matrix that
          # shard must prepare (`prepare`), so the wheel build and the Node install run in
          # parallel with the Rust shards rather than in front of them, and no Rust shard waits
          # on a matrix it does not use.
          python3 - "$units" >> "$GITHUB_OUTPUT" <<'EOF'
          import json, math, sys, tomllib
          probes = tomllib.load(open("verification/policy/mutation-probes.toml", "rb"))["probe"]
          weight = {}
          for probe in probes:
              weight[probe["unit"]] = weight.get(probe["unit"], 0) + 1
          units = sorted(set(open(sys.argv[1]).read().split()))
          sdk_python = [u for u in units if u.startswith("sdk_python.")]
          sdk_typescript = [u for u in units if u.startswith("sdk_typescript.")]
          rest = [u for u in units if u not in sdk_python and u not in sdk_typescript]
          load = sum(weight.get(u, 0) for u in rest)
          per = math.ceil(load / math.ceil(load / 25)) if load else 0
          bins = [[0, [], ""]]
          for unit in rest:
              if bins[-1][1] and bins[-1][0] + weight.get(unit, 0) > per:
                  bins.append([0, [], ""])
              bins[-1][0] += weight.get(unit, 0)
              bins[-1][1].append(unit)
          bins = [b for b in bins if b[1]]
          for prepare, group in (("python", sdk_python), ("typescript", sdk_typescript)):
              if group:
                  bins.append([sum(weight.get(u, 0) for u in group), group, prepare])
          for i, b in enumerate(bins):
              print(f"shard {i}: {b[0]} probe(s) over {len(b[1])} unit(s)" + (f", prepares the {b[2]} matrix" if b[2] else ""), file=sys.stderr)
          shards = [{"shard": i, "args": " ".join(f"--unit {u}" for u in b[1]), "prepare": b[2]} for i, b in enumerate(bins)]
          print("shards=" + json.dumps(shards, separators=(",", ":")))
          print(f"shard-count={len(shards)}")
          EOF
      - name: The scope this check decided
        run: |
          cat "$RUNNER_TEMP/why" 2>/dev/null || true
          echo "measure=${{ steps.scope.outputs.measure }} over ${{ steps.scope.outputs.shard-count }} shard(s); a deferred scope skips the probe jobs, and the complete run (weekly, or dispatched) applies every probe."

  # One shard of the selected units. Its own green is not the lane's: `verdict` is.
  probe:
    name: mutation probe shard ${{ matrix.shard }}
    needs: scope
    if: needs.scope.outputs.measure == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.shards) }}
    # The wall-clock bound, per shard. A shard holds at most 25 probes, which fits well inside
    # it; a shard that does not is cancelled, never extended, and `verdict` reports the lane
    # failed because that shard stated no verdict.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up the pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # No host Rust toolchain is installed or consulted: every Rust member of a probe's
      # battery is a Bazel test target, compiled by the compiler MODULE.bazel pins.

      # The lane's own false-green catalogue, first: it is python-only and fails in
      # seconds, before ~26 cargo runs discover the same defect slowly.
      - name: Mutation-lane self-tests
        run: python3 tools/verification/test_mutation_lane.py

      # THE SDK MATRICES, PREPARED BY THE SHARD THAT NEEDS THEM. A probe over an `sdk_python.*`
      # unit needs the Bazel-built abi3 wheel installed into a pinned-interpreter environment,
      # and one over an `sdk_typescript.*` unit needs the pinned Node runtimes and the built
      # native binding. They are PREPARED here, by the same scripts the complete run uses
      # (`verification.yml`), and the lane only MEASURES: a preparation failure stops the job
      # before the lane can state a verdict, so a matrix that did not build is a red job and
      # never a measured one. A shard that carries no SDK unit prepares nothing and pays
      # nothing; the SDK shards run beside the Rust shards, not in front of them.
      - name: Install uv at a pinned version
        if: matrix.prepare == 'python'
        run: pipx install uv==0.12.3 && uv --version

      - name: Prepare the Python SDK matrix
        if: matrix.prepare == 'python'
        run: ./scripts/prepare_python_matrix.sh

      - name: Prepare the TypeScript SDK matrix
        if: matrix.prepare == 'typescript'
        run: |
          set -euo pipefail
          # The mTLS cases mint their X.509 material with tools/gen_mtls_test_material.py on
          # this job's `python3`, the pinned interpreter, which carries no `cryptography`;
          # without it every such case is skipped and the battery FAILS.
          python3 -m pip install --quiet -r tools/requirements-mtls-test-material.txt
          ./scripts/prepare_node_matrix.sh

      # Unpiped, and the verdict line is read from the exit status: a gate read through a
      # pipe reports the pipe's status, which has already turned a failed gate green once
      # in this repository. The output also goes to a file, which `verdict` composes.
      #
      # No skip-unprepared flag: every probe a shard selects is measured in the environment the
      # shard prepared, and a probe whose environment is absent FAILS. An absent prepared
      # environment in a lane that was supposed to have one is a defect, not a missing
      # measurement, so it must not be reported UNAVAILABLE and passed over.
      - name: Apply every probe this shard selected
        if: needs.scope.outputs.measure == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/shard"
          log="$RUNNER_TEMP/shard/shard-${{ matrix.shard }}.log"
          status=0
          tools/verification/verify-mutations ${{ matrix.args }} > "$log" 2>&1 || status=$?
          cat "$log"
          exit "$status"
      - name: Keep this shard's output for the verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard/
          if-no-files-found: ignore
          retention-days: 7

  # THE LANE'S CHECK. It runs whenever the scope decided to measure, whatever the shards did,
  # and composes their output: green only when every shard the scope decided on stated exactly
  # one verdict and that verdict was PASS. A cancelled or crashed shard states none, so it
  # cannot read as measured.
  verdict:
    name: V0 evidence self-test (mutation probes)
    needs: [scope, probe]
    if: always() && needs.scope.outputs.measure == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up the pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Collect every shard's output
        uses: actions/download-artifact@v8
        with:
          pattern: mutation-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/shards
      - name: Compose the shards' verdicts
        run: tools/verification/verify-mutations --compose "$RUNNER_TEMP/shards" --shards ${{ needs.scope.outputs.shard-count }}
