# SPDX-License-Identifier: Apache-2.0
#
# ADR-MCPRE-059 §19 — build the extraction container and report its identity.
#
# WHY IT IS MANUAL. Building the image mints a new evidence identity: the definition is not
# reproducible — it still resolves apt packages, the rustup installer and the mathlib cache
# at build time — so a rebuild legitimately
# invalidates the Lean evidence that named the previous one. That is a deliberate act, not
# something a push to a branch should perform.
#
# HOW IT IS DISTRIBUTED. The assurance requirement is that Lean evidence identifies the
# environment that produced it and is invalidated when that environment changes; a content
# digest does that wherever the bytes sit. This job builds on a GitHub-hosted arm64 runner and
# uploads the preserved archive as a workflow artifact (30 days). Hosted `verification.yml`
# does not read that artifact: it downloads the archive from the GitHub Release
# `extraction-archive-<first 8 hex of the artifact digest>`, as `archive.part-*`, checks the
# concatenation against `archive_digest` in the lock, and loads it by digest. Moving an
# archive from this artifact to that release is a manual, reviewed publication, never a step
# of this workflow -- see docs/dev/hosted-runner-findings.md, "Publishing a new extraction
# archive". Ruling on storage: verification/reviews/rulings/extraction-artifact-storage-2026-09-09.md
#
# WHAT IT DOES BESIDES BUILD. It PRESERVES the artifact, because a digest is identity and not
# preservation: the image cannot be rebuilt -- see above -- so an identity over bytes that live
# only in Docker's local store names an environment nothing can execute again.
# `extraction-image identity` writes the archive to the store `MCP_RE_EXTRACTION_ARTIFACT_STORE`
# names (here `$RUNNER_TEMP/extraction-artifacts`) under its own digest and reports both.
#
# WHAT IT DOES NOT DO. It does not update `verification/policy/toolchains.lock.toml`. The
# identity is REPORTED — the artifact digest, the archive digest, and the
# `definition_digest` of the Dockerfile it was built from, because those are one fact and
# recording only the first is what let a pin go on naming an old image through three
# Dockerfile changes (MCPRE-181). Moving the pin onto it is a separate reviewed commit; the
# lock is what says which prover the repository's formal evidence was produced by, and a
# workflow that could rewrite it would be a workflow that can change what every lean://
# claim means.
name: Extraction image (manual build)

on:
  workflow_dispatch:

# Reading the tree and uploading a workflow artifact need nothing more. Publishing the
# archive as a release asset is a separate manual act and is deliberately not granted here.
permissions:
  contents: read

jobs:
  build:
    name: build + smoke-check + report identity (linux/arm64)
    # Built on a GitHub-hosted arm64 runner: the platform is linux/arm64, and an amd64 build of
    # identical pins is a different instrument. The image is not consumed from this runner's
    # Docker store. It is preserved as an archive (uploaded below) whose digest the lock records,
    # and every verification run loads that archive and checks the image identity.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Set up the pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Containerd image store, so an image id is the manifest digest the lock records
        run: |
          set -euo pipefail
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          echo "MCP_RE_EXTRACTION_ARTIFACT_STORE=$RUNNER_TEMP/extraction-artifacts" >> "$GITHUB_ENV"

      - name: The tag this checkout's pins compute to
        id: tag
        run: |
          set -euo pipefail
          # Content-addressed by the toolchain pins and the Dockerfile, never by VERSION —
          # see tools/verification/extraction-image for why both directions of that matter.
          ref="$(python3 tools/verification/extraction-image tag)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "computed tag: $ref"

      # Through the tool, never a hand-written `docker buildx build`. The two would be two
      # definitions of what building this image means, and they diverged the moment one of
      # them stopped attaching a provenance attestation: buildx's default one carries a
      # build timestamp and lands in the manifest list, so an image built one way and
      # re-exported the other way has a DIFFERENT id for identical layers. The smoke checks
      # below then measure an artifact that is not the one `identity` preserves.
      - name: Build
        run: |
          set -euo pipefail
          python3 tools/verification/extraction-image build

      # THE SMOKE CHECKS, through the tool. An image that builds is not an image that
      # works: the image pinned on 2026-08-30 built fine and could not run Lean at all.
      #
      # They live in the tool because a RECEIVING host asks the same question: a host handed
      # the preserved archive has to establish that what it received works, without
      # rebuilding, since a rebuild of this definition is a different instrument. As workflow
      # steps they could only ever be asked on the build path.
      #
      # `--built` because nothing is pinned to this image yet; a receiving host runs
      # `extraction-image smoke` with no flag and gets the preserved artifact.
      - name: Smoke — the built image actually works
        run: |
          set -euo pipefail
          python3 tools/verification/extraction-image smoke --built

      # The identity, reported and never written. Recording it in the lock is a separate
      # reviewed commit: the lock is what says which prover the repository's formal evidence
      # was produced by.
      - name: Preserve the artifact and report the identity to record
        run: |
          set -euo pipefail
          # `identity` persists the archive under $MCP_RE_EXTRACTION_ARTIFACT_STORE before it
          # prints anything, and the order is the mechanism: what is reported is
          # what the store holds, not what the image cache happens to hold at the moment.
          python3 tools/verification/extraction-image identity | tee /tmp/identity.out
          {
            echo "### Extraction artifact built and preserved"
            echo
            echo 'Record in `verification/policy/toolchains.lock.toml` `[extraction_container]`'
            echo 'as a SEPARATE reviewed commit — this workflow deliberately does not write it.'
            echo
            echo 'The artifact digest, the archive digest and the definition digest are ONE'
            echo 'evidence-identity fact and must travel together.'
            echo
            echo '```'
            sed -n '/^  \[extraction_container\]/,/^  definition = /p' /tmp/identity.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The preserved archive
        uses: actions/upload-artifact@v7
        with:
          name: extraction-archive-${{ github.run_id }}
          path: ${{ runner.temp }}/extraction-artifacts
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
