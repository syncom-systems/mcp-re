name: mcp-re-codeql-config

# Shared config for the advanced-setup CodeQL workflow (.github/workflows/codeql.yml).
#
# Nothing is excluded by query and no test, example or fixture path is ignored: CodeQL
# inspects executable test code as closely as production code. In particular
# `rust/hard-coded-cryptographic-value` stays ON for both. A test whose property does not
# depend on the exact nonce draws a run-unique one (`mcp_re_test_paths::unique_test_nonce`); a
# fixed value that IS the property (golden vector, signature-base serialization,
# cross-language parity, malformed-nonce control) keeps it and its alert is dismissed
# individually, with a comment naming the fixture. A newly introduced hard-coded
# cryptographic value therefore raises a new alert that needs triage.
# docs/dev/codeql-triage.md holds the per-category dispositions.

# Optional: the napi / PyO3 SDK bindings trip `rust/access-invalid-pointer` on
# proc-macro-GENERATED FFI glue (the N-API / CPython runtime owns and guarantees those
# raw pointers; there is no hand-written unsafe pointer code). Uncomment to silence that
# recurring FP too. Trade-off: you lose the rule on any future hand-written unsafe
# pointer code — re-enable it if the SDK ever grows real unsafe blocks.
# query-filters:
#   - exclude:
#       id: rust/access-invalid-pointer

# `rust/cleartext-logging` is deliberately NOT excluded, even though it is the other
# recurring FP source here. Its noise is a naming heuristic on the PUBLIC `--tls-cert`
# PATH, tainting all of `Config` field-insensitively; its value is catching a secret
# reaching stderr, which is the regression class that matters most in a proxy. Those
# alerts are triaged per alert instead — the standing verdict, the two FP shapes, and
# the dismissal commands are in docs/dev/codeql-triage.md.

# Generated and vendored code only. Tests, examples and fixtures are analysed.
paths-ignore:
  - "sdk/typescript/dist/**"
  - "sdk/typescript/native/**"
